<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#072C49">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="منصة التدريب">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>منصة التطوير والتدريب — جمعية تحفيظ بريدة</title>
<script src="/app-fonts.js" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --navy:#072C49; --navy-2:#0B3A5E; --sky:#9DDAE5; --sky-2:#D3EEF3; --sky-3:#EAF6F9;
  --teal:#007497; --teal-d:#005F7D; --sand:#ECE6DD; --sand-2:#F6F3EE; --paper:#FBFAF7;
  --gold:#DEA470; --clay:#C36F61; --coral:#E9937D;
  --ink:#0E2233; --ink-2:#47596A; --ink-3:#78889A; --line:#E3DCCF; --ok:#2F8F6B; --warn:#C98A2B; --bad:#B4533F;
  --r:14px; --shadow:0 1px 2px rgba(7,44,73,.06),0 6px 20px -8px rgba(7,44,73,.14);
  --font:"SF Arabic","SF Pro AR Display","Mirsal","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--sand-2);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}

/* ---------- Login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.05fr .95fr;background:var(--navy)}
.login-art{position:relative;overflow:hidden;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(120% 90% at 20% 0%,#0E4A75 0%,var(--navy) 60%)}
.pattern{position:absolute;inset:0;opacity:.13;background-image:url("/brand-pattern.svg");background-size:142px}
.login-art>*{position:relative}
.logo-w{filter:brightness(0) invert(1)}
.login-art{text-align:center}.login-art h1{font-size:28px;line-height:1.5;font-weight:600;max-width:520px;margin-inline:auto}
.login-art h1 em{font-style:normal;color:var(--sky)}
.login-art p{color:#BFD3E0;max-width:470px;margin:12px auto 0;font-size:16px}
.stats-row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;text-align:start}
.stats-row div{border-inline-start:2px solid var(--gold);padding-inline-start:14px}
.stats-row b{display:block;font-size:26px;font-weight:600}
.stats-row span{color:#BFD3E0;font-size:13px}
.login-card{background:var(--paper);display:flex;align-items:center;justify-content:center;padding:40px}
.login-box{width:100%;max-width:410px}
.login-box h2{font-size:26px;color:var(--navy);margin-bottom:6px}
.login-box .sub{color:var(--ink-2);margin-bottom:26px}
.ms-btn{width:100%;display:flex;align-items:center;gap:14px;justify-content:center;background:#fff;border:1.5px solid #8B97A3;border-radius:10px;padding:13px 16px;font-weight:500;color:#2F2F2F;transition:.15s}
.ms-btn:hover{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,116,151,.12)}
.ms-logo{display:grid;grid-template-columns:11px 11px;gap:2px}
.ms-logo i{width:11px;height:11px;display:block}
.sep{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px;margin:22px 0 14px}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.role-pick{display:grid;gap:10px}
.role-opt{display:flex;gap:14px;align-items:center;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;transition:.15s}
.role-opt:hover{border-color:var(--teal);transform:translateY(-1px)}
.role-opt .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.role-opt b{display:block;font-weight:600;color:var(--navy)}
.role-opt small{color:var(--ink-2);display:block;direction:ltr;text-align:right;font-size:12.5px}
.login-note{margin-top:22px;font-size:12.5px;color:var(--ink-3);display:flex;gap:8px}
.chip-demo{display:inline-block;background:var(--sky-2);color:var(--navy);font-size:12px;padding:2px 10px;border-radius:99px;margin-bottom:14px}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh;min-height:100dvh}
.side{background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;z-index:30}
.side .pattern{opacity:.1;background-size:132px;height:200px;inset:0 0 auto 0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.brand{position:relative;padding:26px 22px 18px;display:flex;align-items:center;gap:12px}
.brand img{height:58px}
.brand div b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.brand div span{font-size:12px;color:#9FB8CA}
.nav{position:relative;padding:8px 12px;display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav-h{font-size:11.5px;color:#7F9CB2;padding:14px 12px 6px;letter-spacing:.02em}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#CFE0EA;text-align:start;transition:.15s;position:relative}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(157,218,229,.16);color:#fff;font-weight:600}
.nav button.on:before{content:"";position:absolute;inset-inline-start:-12px;top:10px;bottom:10px;width:4px;background:var(--sky);border-radius:4px}
.badge{margin-inline-start:auto;background:var(--coral);color:var(--navy);font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.side-foot{position:relative;padding:14px;border-top:1px solid rgba(255,255,255,.1)}
.switch{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;margin-bottom:10px}
.switch button{padding:8px 6px;border-radius:8px;font-size:13px;color:#BFD3E0}
.switch button.on{background:var(--sky);color:var(--navy);font-weight:600}
.switch-l{font-size:11.5px;color:#7F9CB2;margin-bottom:6px}
.ev-btn{width:100%;display:flex;align-items:center;gap:10px;justify-content:center;border:1px dashed rgba(157,218,229,.5);color:var(--sky);padding:9px;border-radius:10px;font-size:13.5px}
.ev-btn:hover{background:rgba(157,218,229,.1)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 32px}
.hamb{display:none;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);place-items:center}
.gsearch{flex:1;max-width:460px;position:relative}
.gsearch input{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 40px 10px 14px}
.gsearch svg{position:absolute;inset-inline-start:auto;right:12px;top:11px;color:var(--ink-3)}
.top .sp{flex:1}
.icon-btn{position:relative;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--navy)}
.icon-btn .dot{position:absolute;top:-5px;inset-inline-start:-5px;background:var(--clay);color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;font-weight:700}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 12px;border-radius:12px;border:1px solid var(--line);background:#fff}
.user-chip .av{width:34px;height:34px;font-size:14px}
.user-chip b{display:block;font-size:13.5px;line-height:1.3}
.user-chip small{display:block;font-size:11.5px;color:var(--ink-3);direction:ltr;text-align:right;line-height:1.3}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.content{padding:30px 32px 60px;max-width:1280px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1{font-size:27px;color:var(--navy);font-weight:600;line-height:1.3}
.page-h p{color:var(--ink-2);margin-top:2px}

/* ---------- Primitives ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.card h3{font-size:16.5px;color:var(--navy);font-weight:600}
.card .h-sub{color:var(--ink-3);font-size:13px}
.row{display:flex;gap:16px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.center{align-items:center}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g-21{grid-template-columns:2fr 1fr}.g-12{grid-template-columns:1fr 1.2fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:500;background:var(--teal);color:#fff;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--teal-d)}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.sec:hover{background:var(--navy);color:#fff}
.btn.ghost{background:var(--sky-3);color:var(--navy)}
.btn.ghost:hover{background:var(--sky-2)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 11px;border-radius:99px;background:var(--sky-3);color:var(--navy);font-weight:500}
.tag.ok{background:#E2F3EB;color:#1E6B4E}.tag.warn{background:#FBEFD9;color:#8A5C12}.tag.bad{background:#F8E4DF;color:#8F3B2B}.tag.gold{background:#F7E7D4;color:#7A4A18}.tag.navy{background:var(--navy);color:#fff}
.muted{color:var(--ink-2)}.small{font-size:13px}
.bar{height:8px;background:var(--sand);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .6s}
.bar.gold i{background:var(--gold)}.bar.clay i{background:var(--clay)}.bar.navy i{background:var(--navy)}
.empty{text-align:center;padding:48px 20px;color:var(--ink-2)}
.empty .i{width:38px;height:38px;color:var(--ink-3);margin-bottom:8px}
.stars{display:inline-flex;gap:2px;color:var(--gold)}
.stars svg{width:16px;height:16px;fill:currentColor;stroke:none}
.stars .off{color:#DDD6C8}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--ink-3);font-size:12.5px;text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid #EFE9DE;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sky-3)}
.tbl-wrap{overflow:auto}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13.5px;color:var(--ink-2);font-weight:500}
.inp{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;width:100%}
.inp:focus{border-color:var(--teal);outline:0;box-shadow:0 0 0 3px rgba(0,116,151,.14)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;color:var(--ink-2);transition:.15s}
.pill:hover{border-color:var(--teal)}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- Hero / KPI ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--navy) 0%,#0B4670 100%);color:#fff;border-radius:18px;padding:28px 32px;display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.hero .pattern{opacity:.1;inset-inline-end:0;inset-inline-start:40%}
.hero>*{position:relative}
.hero h1{font-size:28px;font-weight:600;line-height:1.4}
.hero p{color:#C4D8E5;margin-top:4px}
.ring{--p:70;width:116px;height:116px;border-radius:50%;background:conic-gradient(var(--sky) calc(var(--p)*1%),rgba(255,255,255,.16) 0);display:grid;place-items:center;flex:none}
.ring div{width:90px;height:90px;border-radius:50%;background:#0A3A5D;display:grid;place-items:center;text-align:center;line-height:1.15}
.ring b{font-size:24px;font-weight:600;display:block}.ring span{font-size:11.5px;color:#BFD3E0}
.kpi{padding:20px}
.kpi .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px}
.kpi .v{font-size:32px;font-weight:600;color:var(--navy);line-height:1.1}
.kpi .v small{font-size:15px;color:var(--ink-3);font-weight:400}
.kpi .l{color:var(--ink-2);font-size:13.5px;margin-top:4px}
.kpi .d{font-size:12.5px;margin-top:8px;color:var(--ok)}

/* ---------- Opportunity cards ---------- */
.opp{display:flex;flex-direction:column;overflow:hidden;transition:.18s}
.opp:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(7,44,73,.28)}
.opp .top-s{height:92px;position:relative;overflow:hidden;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start}
.opp .top-s .pattern{opacity:.2;background-size:104px}
.opp .top-s>*{position:relative}
.opp .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:11px;flex:1}
.opp h4{font-size:16.5px;color:var(--navy);font-weight:600;line-height:1.5}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);font-size:13.5px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:16px;height:16px;color:var(--ink-3)}
.opp .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}
.rec{background:var(--gold);color:var(--navy);font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}
.cat-quran{background:var(--navy)}.cat-lead{background:var(--clay)}.cat-digital{background:var(--teal)}.cat-gov{background:#2C5A78}.cat-comm{background:#B98250}.cat-service{background:#3C8A8C}

/* ---------- Lists / timeline ---------- */
.list-i{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #EFE9DE}
.list-i:last-child{border-bottom:0}
.date-b{width:54px;text-align:center;background:var(--sky-3);border-radius:12px;padding:6px 0;flex:none}
.date-b b{display:block;font-size:20px;line-height:1.2;color:var(--navy)}.date-b span{font-size:12px;color:var(--teal);font-weight:500}
.tl{position:relative;padding-inline-start:30px}
.tl:before{content:"";position:absolute;inset-inline-start:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:20px}
.tl-i:before{content:"";position:absolute;inset-inline-start:-27px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--teal);border:3px solid #fff;box-shadow:0 0 0 2px var(--teal)}
.cert{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(120deg,#fff,var(--sand-2))}
.cert .seal{width:46px;height:46px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:var(--gold);flex:none}

/* ---------- Charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);fill:var(--ink-2);font-size:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.hb{display:grid;grid-template-columns:200px 1fr 48px;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.hb .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat{display:grid;gap:4px}
.heat .c{border-radius:8px;padding:10px 6px;text-align:center;font-size:13px;cursor:pointer;border:2px solid transparent;transition:.12s}
.heat .c:hover,.heat .c.sel{border-color:var(--navy)}
.heat .hd{font-size:12px;color:var(--ink-2);text-align:center;padding:4px 2px;line-height:1.35;display:flex;align-items:flex-end;justify-content:center}
.heat .rl{font-size:13px;display:flex;align-items:center;color:var(--ink)}
.lv0{background:#E6F2EE;color:#1E6B4E}.lv1{background:var(--sky-2);color:var(--navy)}.lv2{background:#F4D9B8;color:#6B4015}.lv3{background:var(--clay);color:#fff}

/* ---------- Inbox ---------- */
.mail{display:grid;grid-template-columns:360px 1fr;min-height:560px;overflow:hidden}
.mail-l{border-inline-end:1px solid var(--line);overflow:auto;max-height:680px}
.mi{padding:14px 16px;border-bottom:1px solid #EFE9DE;cursor:pointer;display:grid;gap:3px;position:relative}
.mi:hover{background:var(--sky-3)}.mi.on{background:var(--sky-2)}
.mi b{font-weight:500;font-size:14px;color:var(--navy);display:flex;justify-content:space-between;gap:8px}
.mi.unread b{font-weight:700}
.mi.unread:before{content:"";position:absolute;inset-inline-end:6px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--teal)}
.mi span{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi small{font-size:12px;color:var(--ink-3)}
.mail-r{padding:26px 30px;overflow:auto;max-height:680px;background:var(--paper)}
.eml{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:620px;margin:16px auto 0}
.eml .hd{background:var(--navy);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.eml .hd .pattern{opacity:.12}.eml .hd>*{position:relative}
.eml .bd{padding:24px;line-height:1.9}
.eml .bd h4{font-size:18px;color:var(--navy);margin-bottom:8px}
.eml .ft{background:var(--sand);padding:14px 24px;font-size:12px;color:var(--ink-2)}
.eml-meta{font-size:13.5px;color:var(--ink-2);display:grid;gap:2px}
.eml-meta b{color:var(--navy);font-weight:600}
.outlook-tag{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;background:#E8F0FB;color:#0F4E9A;padding:3px 10px;border-radius:6px}

/* ---------- Drop / modal / toast ---------- */
.dd{position:absolute;top:56px;inset-inline-end:0;width:370px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -12px rgba(7,44,73,.35);z-index:50;overflow:hidden}
.dd .h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dd .it{padding:12px 16px;border-bottom:1px solid #F0EADF;display:flex;gap:12px;cursor:pointer;font-size:13.5px}
.dd .it:hover{background:var(--sky-3)}
.dd .it .ic{width:34px;height:34px;border-radius:9px;background:var(--sky-2);display:grid;place-items:center;color:var(--teal);flex:none}
.mask{position:fixed;inset:0;background:rgba(7,44,73,.55);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:640px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .2s}
.modal.wide{max-width:820px}
.m-h{position:relative;overflow:hidden;background:var(--navy);color:#fff;padding:24px 28px}
.m-h .pattern{opacity:.12}.m-h>*{position:relative}
.m-h h3{font-size:21px;line-height:1.5;color:#fff;font-weight:600;padding-inline-end:40px}
.m-x{position:absolute!important;z-index:5;top:16px;inset-inline-end:16px;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}

.emp-cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.emp-tasks{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:12px}
.emp-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px}
.emp-h2{font-size:15px;color:var(--ink-2);font-weight:600;margin:10px 2px 0}
.tk{display:flex;align-items:center;gap:14px;padding:16px 18px;flex-wrap:wrap}
.tk-alert{border-color:#E9B8AC}.tk-wait{background:var(--paper);box-shadow:none}
.tk-ic,.tk-date{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;flex:none}
.tk-ic .i{width:24px;height:24px}
.tk-date{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}.tk-date span{font-size:11.5px;opacity:.85}.tk-date b{font-size:20px;font-family:var(--display)}
.tk-body{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:3px}
.tk-body b{font-size:16px;color:var(--navy);font-weight:700}.tk-body>span{font-size:14px;color:var(--ink-2)}
.tk-bar{height:8px;border-radius:6px;background:var(--sand);overflow:hidden;max-width:320px;margin-top:4px}.tk-bar i{display:block;height:100%;background:var(--teal)}
.tk-btn{min-height:44px;padding:0 20px}
.emp-prog{background:var(--navy);color:#fff;border:0;padding:20px;display:flex;align-items:center;gap:18px}
.emp-prog .ring div{background:var(--navy)}
.emp-prog-t{display:block;font-size:16px;font-weight:700}.emp-prog span{display:block;font-size:13.5px;color:#C4D8E5;margin-top:2px}
.linkbtn{color:var(--sky);font-size:14px;font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.emp-rec .linkbtn{color:var(--teal)}
.emp-rec-i{display:flex;flex-direction:column;gap:2px;text-align:start;width:100%;padding:10px 12px;border-radius:12px;background:var(--sand-2);margin-bottom:8px}
.emp-rec-i b{font-size:14.5px;color:var(--navy)}.emp-rec-i span{font-size:13px;color:var(--ink-2)}
.emp-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.emp-choice button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;padding:18px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.emp-choice button:hover{border-color:var(--teal)}.emp-choice .i{width:28px;height:28px;color:var(--teal)}.emp-choice b{font-size:16px;color:var(--navy)}.emp-choice span{font-size:13.5px;color:var(--ink-2)}
@media(max-width:620px){.emp-choice{grid-template-columns:1fr}.emp-head h1{font-size:26px}.tk{padding:14px}.tk-btn{width:100%}}

.kpi .v small,.kpi-c .v small,.kv-val small,.v .unit,.kv-val .unit{font-family:var(--font);font-weight:500;font-size:.48em;color:var(--ink-3);margin-inline-start:4px;letter-spacing:0}
.kpi .v small{font-size:.5em}
.tag,.pill,.rec,.badge{white-space:nowrap;line-height:1.5}
td .tag{margin-inline-start:6px}td .tag:first-child{margin-inline-start:0}
td b{font-weight:600}
.tbl-wrap td:first-child{min-width:170px}
td.small.num,td .small.num{white-space:nowrap}
.nav-h,.switch-l,.save-st{font-size:12.5px}
.ring span{font-size:12px;line-height:1.3;display:block;max-width:84px;margin-inline:auto}
.chart text{font-size:13px}
.mini{font-size:12px}
.tabs{position:relative}.tabs button{position:relative;z-index:1}.tabs button.on{border-bottom-color:transparent}.tabs>.ui-pill{height:3px;background:var(--teal);border-radius:3px 3px 0 0}.tabs{scrollbar-width:thin;-webkit-mask-image:linear-gradient(to left,#000 92%,transparent);mask-image:linear-gradient(to left,#000 92%,transparent)}
@media(max-width:900px){.tbl-wrap table{min-width:680px}.tbl-wrap td{min-width:110px}.tabs button{padding:10px 12px;font-size:14px}.ring{width:104px;height:104px}.ring div{width:82px;height:82px}.ring b{font-size:22px}}

:root{--font:"Thmanyah Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;--display:"Thmanyah Serif Display","Thmanyah Sans","IBM Plex Sans Arabic",serif}
body{font-feature-settings:"kern" 1}
.page-h h1,.hero h1,.login-art h1,.login-box h2,.login-art .brand-l b,.m-h h3,.kpi .v,.kpi-c .v,.ring b,.stats-row b{font-family:var(--display);font-weight:700;letter-spacing:0}
.page-h h1{font-size:30px}.hero h1{font-size:30px}


</style>

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=n=>`<span class="num">${Number(n).toLocaleString('en',{maximumFractionDigits:1})}</span>`;
const num=(n,d=1)=>Number(n).toLocaleString('en',{maximumFractionDigits:d});
const MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAY=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=()=>isoOf(new Date());
const D=s=>new Date(s+'T12:00:00');
const addDays=(iso,n)=>{const d=D(iso);d.setDate(d.getDate()+n);return isoOf(d)};
const fmt=s=>s?`${D(s).getDate()} ${MON[D(s).getMonth()]} ${D(s).getFullYear()}`:'—';
const fmtS=s=>s?`${D(s).getDate()} ${MON[D(s).getMonth()]}`:'—';
const dow=s=>DAY[D(s).getDay()];
const dBetween=(a,b)=>Math.round((D(b)-D(a))/864e5);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowISO=()=>new Date().toISOString();
const mmss=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${pad(s%60)}`};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const pct=(a,b)=>b?Math.round(a/b*1000)/10:null;
const palette=['#072C49','#007497','#C36F61','#B98250','#2C5A78','#3C8A8C','#8C5A6E','#5B7A99'];
const initials=n=>{const p=String(n||'؟').replace(/^(د\.|م\.|أ\.)\s*/,'').split(' ');return (p[0][0]||'')+(p[1]?p[1][0]:'')};
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function api(path,opts={}){
  const r=await fetch(path,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json','X-Role':S.role||'',...(opts.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&!['/api/login','/api/me'].includes(path)&&S.me){S.me=null;S.role=null;closeLayer();draw();toast('انتهت الجلسة','سجّل الدخول من جديد')}
  if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{status:r.status,body:j});
  return j;
}
async function persistInit(){}
const rowsOf=c=>c==='settings'?[{...DB.settings,id:'settings'}]:DB[c];
const ALLC=()=>[...COLS,'settings'];
function setBase(c,id,obj,ver){(P.base[c]||(P.base[c]={}))[id]=obj?JSON.stringify(obj):null;(P.vers[c]||(P.vers[c]={}))[id]=ver}
async function loadAll(){
  const d=await api('/api/data');
  P.base={};P.vers=d.vers||{};
  for(const c of COLS){DB[c]=d[c]||[];P.base[c]={};for(const r of DB[c])P.base[c][r.id]=JSON.stringify(r)}
  const st=d.settings||{};delete st.id;
  for(const k of Object.keys(DB.settings))delete DB.settings[k];
  Object.assign(DB.settings,clone(SETTINGS_DEFAULT),st);
  P.base.settings={settings:JSON.stringify(st&&Object.keys(st).length?{...st,id:'settings'}:null)};
  P.base.settings.settings=JSON.stringify({...DB.settings,id:'settings'});
  P.seq=d.seq;P.loaded=true;return false;
}
function diffCol(c){
  const ops=[],base=P.base[c]||{},vers=P.vers[c]||{},seen=new Set();
  for(const r of rowsOf(c)){if(!r||!r.id)continue;seen.add(r.id);const s=JSON.stringify(r);if(base[r.id]!==s)ops.push({col:c,id:r.id,base:vers[r.id]||0,data:JSON.parse(s)})}
  for(const id in base){if(base[id]!=null&&!seen.has(id))ops.push({col:c,id,base:vers[id]||0,delete:true})}
  return ops;
}
function applyServerRow(c,id,data,ver,deleted){
  if(c==='settings'){if(data){const st={...data};delete st.id;Object.assign(DB.settings,st)}setBase(c,id,data?{...DB.settings,id:'settings'}:null,ver);return}
  const arr=DB[c];const i=arr.findIndex(r=>r&&r.id===id);
  if(deleted||!data){if(i>=0)arr.splice(i,1);setBase(c,id,null,ver);return}
  if(i>=0)arr[i]=data;else arr.push(data);setBase(c,id,data,ver);
}
function commit(...cols){cols.forEach(c=>P.dirty.add(c));clearTimeout(P.t);P.t=setTimeout(flush,250)}
async function flush(){
  if(!S.me||!P.loaded)return;
  if(P.busy){clearTimeout(P.t);P.t=setTimeout(flush,250);return}
  P.busy=true;P.dirty.clear();
  let reverted=[],sent=0;
  try{
    const ops=ALLC().flatMap(diffCol);
    if(!ops.length)return;
    sent=ops.length;
    const r=await api('/api/sync',{method:'POST',body:JSON.stringify({ops})});
    r.results.forEach((x,i)=>{
      const op=ops[i];
      if(x.ok)setBase(op.col,op.id,op.delete?null:op.data,x.ver);
      else{applyServerRow(op.col,op.id,x.data,x.ver,x.deleted||!x.data);if(op.col!=='audit')reverted.push(x)}
    });
    P.failed=false;P.online=true;P.msg='محفوظ في الخادم · '+new Date().toLocaleTimeString('ar-SA-u-nu-latn',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    P.failed=true;P.online=false;P.msg='تعذّر الحفظ في الخادم — سيُعاد المحاولة ('+e.message+')';
    clearTimeout(P.t);P.t=setTimeout(flush,3000);
  }finally{P.busy=false}
  const el=$('#savest');if(el)el.innerHTML=saveStHtml();
  if(reverted.length){
    const c=reverted.find(x=>x.conflict),d=reverted.find(x=>x.denied);
    if(c)toast('تعارض في الحفظ',c.reason+'. عُرضت أحدث نسخة.');
    if(d)toast('رفض الخادم الحفظ',d.reason);
    if(!$('#layer').innerHTML)draw();
  }
}
async function poll(){
  if(!S.me||!P.loaded||P.busy)return;
  try{
    const r=await api('/api/changes?since='+P.seq);
    let n=0;
    for(const x of r.rows){
      const known=(P.vers[x.col]||{})[x.id];
      if(known===x.ver)continue;
      const local=x.col==='settings'?JSON.stringify({...DB.settings,id:'settings'}):JSON.stringify((DB[x.col]||[]).find(o=>o&&o.id===x.id)||null);
      const base=(P.base[x.col]||{})[x.id];
      if(base!==undefined&&base!==null&&local!==base)continue; // تعديل محلي معلّق: يُحسم عند الحفظ
      applyServerRow(x.col,x.id,x.data,x.ver,x.deleted);if(x.col!=='audit')n++;
    }
    P.seq=r.seq;
    if(!P.online){P.online=true;P.failed=false;P.msg='متصل بالخادم';const el=$('#savest');if(el)el.innerHTML=saveStHtml()}
    const ae=document.activeElement,typing=ae&&ae.matches&&ae.matches('input,textarea,select');
    if(n&&!$('#layer').innerHTML&&!typing&&S.view!=='player'&&S.view!=='reader'){const y=window.scrollY;draw();window.scrollTo(0,y)}
  }catch(e){if(P.online){P.online=false;P.msg='انقطع الاتصال بالخادم';const el=$('#savest');if(el)el.innerHTML=saveStHtml()}}
}

/* ================= الدورات الحضورية: التسجيل والمقاعد ================= */
const ACTIVE_ENR=['registered','attended','completed'];
const enrollsOf=cid=>DB.enrolls.filter(e=>e.courseId===cid);
const seatsUsed=cid=>enrollsOf(cid).filter(e=>ACTIVE_ENR.includes(e.status)).length;
const seatsLeft=c=>c.seats==null?null:Math.max(0,c.seats-seatsUsed(c.id));
const myEnroll=(uid_,cid)=>DB.enrolls.find(e=>e.userId===uid_&&e.courseId===cid&&!['cancelled','rejected'].includes(e.status));
const STATUS_AR={registered:'مسجّل',waitlist:'قائمة الانتظار',pending_lm:'بانتظار اعتماد الرئيس المباشر',pending_tm:'بانتظار اعتماد إدارة التدريب',rejected:'مرفوض',cancelled:'ملغى',attended:'حضر',completed:'مكتمل'};

function requestEnroll(userId,courseId,opts={}){
  const c=courseById(courseId),u=U(userId);
  if(!c||!u)return {ok:false,msg:'بيانات غير صحيحة'};
  if(c.status!=='open')return {ok:false,msg:'الدورة غير متاحة للتسجيل'};
  if(myEnroll(userId,courseId))return {ok:false,msg:'يوجد تسجيل أو طلب قائم لهذه الدورة (تكرار مرفوض)'};
  if(DB.completions.some(x=>x.userId===userId&&x.kind==='c'&&x.refId===courseId))return {ok:false,msg:'أكملت هذه الدورة سابقًا'};
  let status;
  if(opts.nominatedBy)status='pending_tm';
  else if(DB.settings.lmApproval&&u.managerId)status='pending_lm';
  else status=(c.seats!=null&&seatsLeft(c)===0)?'waitlist':'registered';
  const e={id:uid('en'),userId,courseId,status,at:TODAY(),by:opts.nominatedBy||userId,att:false,pre:null,post:null,demo:false};
  DB.enrolls.push(e);commit('enrolls');
  audit('enroll.request','enroll',e.id,`${u.name} → ${c.title} (${STATUS_AR[status]})`);
  if(status==='registered'){
    notify(userId,`تأكيد التسجيل: ${c.title}`,'تم تسجيلك بنجاح',`<p>تم تأكيد تسجيلك في دورة <b>${esc(c.title)}</b> مع ${esc((trainerById(c.trainerId)||{}).name||'')}.</p><p>📅 ${c.fmt==='ذاتي'?'مسار ذاتي حتى '+fmt(c.date):dow(c.date)+' '+fmt(c.date)} · ${esc(c.time||'')}<br>📍 ${esc(c.loc||'')}<br>⏱ ${num(c.hours)} ساعات معتمدة</p>`,'عرض تدريبي','my-learning');
  }else if(status==='pending_lm'&&u.managerId){
    notify(userId,`استلمنا طلبك: ${c.title}`,'ننتظر موافقة رئيسك',`<p>وصل طلب تسجيلك في دورة <b>${esc(c.title)}</b> إلى <b>${esc((U(u.managerId)||{}).name||'رئيسك')}</b>. بيوصلك إشعار أول ما يعتمده.</p>`,'عرض دوراتي','my-learning');
    notify(u.managerId,`طلب تسجيل بانتظار اعتمادك: ${u.name}`,'طلب يحتاج اعتمادًا',`<p>يطلب <b>${esc(u.name)}</b> التسجيل في دورة <b>${esc(c.title)}</b>.</p>`,'مراجعة الطلبات','team');
  }
  return {ok:true,status,enroll:e};
}
function promoteWaitlist(courseId){
  const c=courseById(courseId);if(!c)return;
  while(seatsLeft(c)>0){
    const w=enrollsOf(courseId).filter(e=>e.status==='waitlist').sort((a,b)=>a.at.localeCompare(b.at))[0];
    if(!w)break;w.status='registered';
    notify(w.userId,`توفر مقعد: ${c.title}`,'تم نقلك من قائمة الانتظار',`<p>توفر مقعد في دورة <b>${esc(c.title)}</b> وتم تسجيلك فيها.</p>`,'عرض تدريبي','my-learning');
    audit('enroll.promote','enroll',w.id,c.title);
  }
  commit('enrolls');
}
function setEnrollStatus(id,status,note){
  const e=DB.enrolls.find(x=>x.id===id);if(!e)return;
  const old=e.status;e.status=status;commit('enrolls');
  audit('enroll.status','enroll',id,`${old} → ${status}${note?' — '+note:''}`);
  const c=courseById(e.courseId);

/** إضافة ثانية كاملة مُشاهَدة [s,s+1) مع دمج المجالات */
function addSecond(p,s){
  const w=p.watched;let i=0;
  while(i<w.length&&w[i][1]<s)i++;
  if(i<w.length&&w[i][0]<=s&&w[i][1]>s)return false;
  if(i<w.length&&w[i][1]===s){w[i][1]=s+1;if(i+1<w.length&&w[i+1][0]===w[i][1]){w[i][1]=w[i+1][1];w.splice(i+1,1)}return true}
  if(i<w.length&&w[i][0]===s+1){w[i][0]=s;return true}
  w.splice(i,0,[s,s+1]);return true;
}
const coveredSec=p=>p?sum(p.watched.map(([a,b])=>b-a)):0;
const lessonPct=(p,dur)=>p&&dur?Math.min(100,coveredSec(p)/Math.ceil(dur)*100):0;

function lessonDone(userId,lib,les){
  const p=getProg(userId,les.id);return lessonPct(p,les.dur)>=reqPct(lib)-1e-9;
}

const libDuration=lib=>sum(allLessons(lib).map(l=>l.dur));
function libWatchDone(userId,lib){const rl=reqLessons(lib);return rl.length>0&&rl.every(l=>lessonDone(userId,lib,l))}
function libPct(userId,lib){
  const rl=reqLessons(lib);if(!rl.length)return 0;
  const tot=sum(rl.map(l=>Math.ceil(l.dur)));const got=sum(rl.map(l=>Math.min(Math.ceil(l.dur),coveredSec(getProg(userId,l.id)))));
  return tot?Math.round(got/tot*100):0;
}

function examState(userId,lib){
  const q=lib.settings||{};const maxA=q.maxAttempts??DB.settings.maxAttempts;const passScore=q.passScore??DB.settings.passScore;const retake=q.allowRetake??DB.settings.allowRetake;
  const round=libRound(userId,lib.id);const at=attemptsOf(userId,lib.id,'post').filter(a=>(a.round||0)===round);const passed=libPassed(userId,lib.id);

function kpiImpact(link){
  const k=DB.kpis.find(x=>x.id===link.kpiId),p=programById(link.programId);if(!k||!p)return null;
  const ms=DB.kpiMeas.filter(m=>m.kpiId===k.id&&inc(m)).sort((a,b)=>a.date.localeCompare(b.date));
  const before=ms.filter(m=>m.date<=(p.start||p.plannedDate||'0000')).slice(-1)[0];
  const after=ms.filter(m=>m.date>(p.end||p.start||p.plannedDate||'9999')).slice(-1)[0];
  if(!before||!after)return {k,p,link,ok:false};
  const diff=after.value-before.value;const rel=before.value?diff/Math.abs(before.value)*100:null;
  const good=k.dir==='down'?diff<0:diff>0;
  return {k,p,link,ok:true,before,after,diff,rel,good};
}

function filteredCourses(){
  const f=S.f,q=f.q.trim();
  let L=DB.courses.filter(c=>c.status==='open'&&inc(c));
  if(q)L=L.filter(c=>(c.title+((trainerById(c.trainerId)||{}).name||'')+CATS[c.cat]).includes(q));
  if(f.cat!=='all')L=L.filter(c=>c.cat===f.cat);
  if(f.fmt!=='all')L=L.filter(c=>c.fmt===f.fmt);
  if(f.rec){const ids=new Set(recommendedFor(ME()).map(x=>x.c.id));L=L.filter(c=>ids.has(c.id))}
  if(f.sort==='date')L.sort((a,b)=>a.date.localeCompare(b.date));
  if(f.sort==='seats')L.sort((a,b)=>(seatsLeft(a)??999)-(seatsLeft(b)??999));
  return L;
}

function attachPlayer(){
  const lib=libById(S.libId);if(!lib)return;const les=allLessons(lib).find(l=>l.id===S.lesId);if(!les)return;
  const v=document.getElementById('vid');
  PL.lib=lib;PL.les=les;PL.v=v;PL.p=ensureProg(S.me,les.id,les.dur);PL.lastCt=null;PL.segStart=0;PL.lastSave=Date.now();PL.prog=false;PL.played=false;PL.doneBefore=lessonDone(S.me,lib,les);
  PL.maxRate=(lib.settings&&lib.settings.maxRate)||DB.settings.maxRate||1;
  PL.fwd=!!((lib.settings&&lib.settings.seekForward)??DB.settings.seekForward);
  updatePlayerUI();if(les.src==='youtube'){ytAttach();return}if(!v)return;
  v.defaultPlaybackRate=1;
  v.addEventListener('loadedmetadata',()=>{if(!PL.p||PL.v!==v)return;let pos=PL.p.pos||0;if(pos>=les.dur-1.5)pos=0;if(pos>0.5){PL.prog=true;try{v.currentTime=pos}catch(e){PL.prog=false}}updatePlayerUI()});
  v.addEventListener('play',()=>{if(!PL.played){PL.played=true;PL.p.plays=(PL.p.plays||0)+1;commit('progress')}PL.lastCt=null});
  v.addEventListener('pause',()=>{savePlayer()});

  v.addEventListener('seeking',()=>{
    if(PL.prog){PL.prog=false;PL.lastCt=null;return}
    const t=v.currentTime,limit=PL.doneBefore?Infinity:Math.max(PL.p.max||0,0)+1.5;
    if(!PL.fwd&&t>limit){PL.prog=true;PL.p.blocked=(PL.p.blocked||0)+1;v.currentTime=Math.min(PL.p.max||0,Math.max(0,v.duration||1e9));toast('لا يمكن تخطي المحتوى','يلزم مشاهدة الدرس بالتسلسل حتى يُحتسب');audit('seek.blocked','lesson',les.id,`إلى ${Math.round(t)}ث`)}
    PL.lastCt=null;
  });
  v.addEventListener('seeked',()=>{PL.lastCt=null;PL.segStart=v.currentTime;updatePlayerUI()});

}
function onTick(){const v=PL.v;if(!v||v.seeking||v.paused)return;tickTo(v.currentTime)}
function tickTo(ct){
  const p=PL.p,les=PL.les,lib=PL.lib;if(!p)return;
  if(PL.lastCt==null||ct<PL.lastCt-0.01||ct-PL.lastCt>1.6){PL.lastCt=ct;PL.segStart=ct;return}
  let ch=false;
  for(let k=Math.floor(PL.lastCt);k<Math.floor(ct);k++){if(k>=0&&k<Math.ceil(les.dur)&&PL.segStart<=k+0.5&&addSecond(p,k))ch=true}
  PL.lastCt=ct;
  if(ct>(p.max||0)&&ct<=les.dur+0.5){p.max=ct}
  p.pos=ct;
  if(ch){
    p.updated=nowISO();PL.dirtyAt=Date.now();updatePlayerUI();
    const nowDone=lessonDone(S.me,lib,les);
    if(nowDone&&!PL.doneBefore){PL.doneBefore=true;savePlayer();toast('اكتمل الدرس',les.title);refreshSide();checkAutoComplete(S.me,lib)}
  }
  if(Date.now()-PL.lastSave>5000)savePlayer();
}

function saveLibEd(){
  if(!guard('lib.write'))return;
  const e=S.ed;const errs=[];
  e.title=(e.title||'').trim();if(!e.title)errs.push('عنوان الدورة مطلوب');
  if(DB.libs.some(l=>l.id!==e.id&&l.title.trim()===e.title))errs.push('يوجد دورة بالعنوان نفسه (تكرار)');
  const s=e.settings;if(!(s.requiredPct>=50&&s.requiredPct<=100))errs.push('نسبة المشاهدة بين 50 و100');if(!(s.passScore>=1&&s.passScore<=100))errs.push('درجة النجاح بين 1 و100');if(!(s.maxAttempts>=1&&s.maxAttempts<=10))errs.push('عدد المحاولات بين 1 و10');
  if(!(e.creditHours>=0))errs.push('الساعات المعتمدة غير صالحة');
  allLessons(e).forEach((l,i)=>{if(!(l.title||'').trim())errs.push(`الدرس ${i+1}: العنوان مطلوب`);if(!(l.dur>0))errs.push(`الدرس ${i+1}: المدة غير صالحة`)});
  e.quiz.forEach((q,i)=>{if(!(q.q||'').trim())errs.push(`السؤال ${i+1}: النص مطلوب`);if(q.o.filter(o=>(o||'').trim()).length<2)errs.push(`السؤال ${i+1}: خياران على الأقل`);if(!(q.o[q.ans]||'').trim())errs.push(`السؤال ${i+1}: الإجابة الصحيحة فارغة`)});
  if(errs.length){toast('تعذّر الحفظ',errs[0]);return}
  if(e.status==='published'){const iss=libPublishIssues(e);if(iss.length){toast('لا يمكن النشر',iss[0]);return}}
  // معرفات ثابتة للدروس
  e.modules.forEach((m,mi)=>{m.id=m.id||'M'+(mi+1);m.lessons.forEach(l=>{l.id=l.id||uid('ls')})});
  if(e.id){const i=DB.libs.findIndex(l=>l.id===e.id);DB.libs[i]=e;audit('lib.update','lib',e.id,e.title)}
  else{e.id=uid('L');e.addedAt=TODAY();DB.libs.push(e);audit('lib.create','lib',e.id,e.title)}
  commit('libs');S.ed=null;closeLayer();toast('تم حفظ الدورة',e.title);draw();
}

function saveTA(){
  const {empId,d}=S.ta;const u=U(empId);if(!u||u.managerId!==S.me){toast('غير مصرّح');return}
  const j=jobById(u.jobId);let n=0;
  for(const jc of j.comps){
    const x=d[jc.compId];if(x.mgr==null)continue;
    if(jc.req-x.mgr>0&&!x.causes.length){toast('حدّد سبب الفجوة',(compById(jc.compId)||{}).name);return}
  }
  j.comps.forEach(jc=>{
    const x=d[jc.compId];if(x.mgr==null)return;
    let a=assessOf(empId,jc.compId);
    if(!a){a={id:'as_'+empId+'_'+jc.compId,empId,compId:jc.compId,self:null,mgr:null,selfAt:null,mgrAt:null,causes:[],note:'',history:[],demo:false};DB.assess.push(a)}
    a.history=a.history||[];const last=a.history.length?a.history[a.history.length-1].level:null;
    if(last!==x.mgr){a.history.push({at:TODAY(),level:x.mgr});}
    a.mgr=x.mgr;a.mgrAt=TODAY();a.causes=jc.req-x.mgr>0?x.causes:[];a.note=x.note;n++;
  });
  if(!n){toast('لم تقيّم أي كفاية');return}
  commit('assess');audit('assess.mgr','assess',empId,`${n} كفاية`);closeLayer();toast('تم حفظ التقييم',`${n} كفايات`);draw();
}

function needsMatrix(){

function saveScore(eid,kind,val){
  if(!guard('attend.write'))return;const e=DB.enrolls.find(x=>x.id===eid);if(!e)return;
  const idx=DB.tests.findIndex(t=>t.userId===e.userId&&t.ref==='c'&&t.refId===e.courseId&&t.kind===kind);
  if(val===''){if(idx>=0){DB.tests.splice(idx,1);commit('tests')}return}
  const v=+val;if(!(v>=0&&v<=100)){toast('الدرجة بين 0 و100');return}

  if(!guard('attend.write'))return;const c=courseById(S.mc);if(!c)return;
  if(c.date>TODAY()){toast('لا يمكن إغلاق دورة لم يحن موعدها');return}
  const open=enrollsOf(c.id).filter(e=>e.att&&e.status==='attended');
  if(open.length){toast('يوجد حاضرون لم يُعتمد إتمامهم',`${open.length} — اعتمد الإتمام أولًا`);return}

const MIN_N={l1:5,l2:3,l3:3};
const insufficient=(why)=>`<span class="kpi-c"><span class="na">بيانات غير كافية</span></span>${why?`<div class="ins">${why}</div>`:''}`;
function l1Stats(){
  const ss=DB.surveys.filter(inc);const keys=[...new Set(ss.map(s=>s.ref+'|'+s.refId))];
  return keys.map(k=>{const [ref,rid]=k.split('|');const rs=ss.filter(s=>s.ref===ref&&s.refId===rid);
    return {ref,rid,n:rs.length,pct:avg(rs.map(surveyPct)),items:SURVEY_ITEMS.map(([key])=>avg(rs.map(r=>r[key]).filter(v=>v>0))),notes:rs.filter(r=>r.note).length};
  }).sort((a,b)=>b.n-a.n);
}
function l2Stats(){
  const pairs=learningPairs();const keys=[...new Set(pairs.map(p=>p.ref+'|'+p.refId))];
  return keys.map(k=>{const [ref,rid]=k.split('|');const ps=pairs.filter(p=>p.ref===ref&&p.refId===rid);
    return {ref,rid,n:ps.length,pre:avg(ps.map(p=>p.pre)),post:avg(ps.map(p=>p.post)),gain:avg(ps.map(p=>p.gain))};
  });
}
function l3Stats(){
  const all=evalsDue();const done=all.filter(x=>x.ev);
  return {all,done,pending:all.filter(x=>x.state==='due'),missed:all.filter(x=>x.state==='missed'),overdue:all.filter(x=>x.state==='due'&&dBetween(x.due,TODAY())>14),avg:done.length?avg(done.map(x=>x.ev.rating)):null};
}

}

/* ---------- الملفات المرفقة (تُخزَّن مع البيانات؛ حدود الحجم موثّقة) ---------- */
function fileCheck(f){
  if(!f)return 'اختر ملفًا';
  if(!FILE_OK.includes(f.type))return 'نوع الملف غير مسموح (PDF أو JPG أو PNG فقط)';
  if(f.size>FILE_MAX)return `حجم الملف يتجاوز الحد المسموح (${(FILE_MAX/1e6).toFixed(1)} م.ب)`;
  if(f.size<200)return 'الملف فارغ أو تالف';
  return '';
}
function readDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(f)})}
async function storeFile(f,by){
  const bad=fileCheck(f);if(bad)return {ok:false,msg:bad};
  try{
    const data=await readDataURL(f);
    const head=data.slice(0,40);
    const okMagic=(f.type==='application/pdf'&&/^data:application\/pdf;base64,JVBER/.test(head))||(f.type==='image/jpeg'&&/^data:image\/jpeg;base64,\/9j\//.test(head))||(f.type==='image/png'&&/^data:image\/png;base64,iVBOR/.test(head));
    if(!okMagic)return {ok:false,msg:'محتوى الملف لا يطابق نوعه المعلن'};
    const rec={id:uid('f'),name:String(f.name||'ملف').slice(0,120),type:f.type,size:f.size,data,by:by||S.me,at:nowISO(),demo:false};
    DB.files.push(rec);commit('files');return {ok:true,id:rec.id};
  }catch(e){return {ok:false,msg:'تعذّرت قراءة الملف'}}
}
const fileLink=id=>{const f=fileById(id);return f?`<a class="flink" href="${f.data}" download="${esc(f.name)}" target="_blank" rel="noopener">${ico('clip')}${esc(f.name)} <span class="muted num">(${Math.round(f.size/1024)} ك.ب)</span></a>`:'<span class="muted">ملف غير متاح</span>'};

/* ---------- التسجيل في الدورات المسجلة ---------- */
const libEnrOf=(u,l)=>DB.libenr.find(e=>e.userId===u&&e.libId===l&&e.status!=='cancelled');
function registerLib(userId,libId){
  const lib=libById(libId),u=U(userId);
  if(!lib||!u)return {ok:false,msg:'بيانات غير صحيحة'};
  if(lib.status!=='published')return {ok:false,msg:'الدورة غير منشورة'};
  if(libEnrOf(userId,libId))return {ok:false,msg:'أنت مسجّل في هذه الدورة بالفعل (تكرار مرفوض)'};
  if(libPassed(userId,libId))return {ok:false,msg:'أكملت هذه الدورة سابقًا'};
  const e={id:uid('le'),userId,libId,at:nowISO(),status:'registered',demo:false};
  DB.libenr.push(e);commit('libenr');audit('lib.register','libenr',e.id,`${u.name} → ${lib.title}`);
  return {ok:true,enroll:e};
}

/* ---------- طلب إعادة الدورة ---------- */
const retakesOf=(u,l)=>DB.retakes.filter(r=>r.userId===u&&r.libId===l);
const libRound=(u,l)=>retakesOf(u,l).filter(r=>r.status==='approved').length;
function requestRetake(userId,libId,reason){
  const lib=libById(libId),u=U(userId);if(!lib||!u)return {ok:false,msg:'بيانات غير صحيحة'};
  reason=String(reason||'').trim();
  if(reason.length<10)return {ok:false,msg:'اكتب سبب طلب الإعادة (10 أحرف على الأقل)'};
  const st=examState(userId,lib);
  if(st.passed)return {ok:false,msg:'اجتزت الاختبار بالفعل'};
  if(!st.exhausted)return {ok:false,msg:'لا يمكن طلب الإعادة قبل استنفاد جميع محاولات الاختبار'};
  if(retakesOf(userId,libId).some(r=>r.status==='pending'))return {ok:false,msg:'لديك طلب إعادة قيد المراجعة (تكرار مرفوض)'};
  const r={id:uid('rt'),userId,libId,reason,status:'pending',at:nowISO(),round:libRound(userId,libId),attemptsUsed:st.attempts,decidedBy:null,decidedAt:null,note:'',demo:false};
  DB.retakes.push(r);commit('retakes');audit('retake.request','retake',r.id,`${u.name} — ${lib.title}`);
  tmUsers().forEach(m=>notify(m.id,`طلب إعادة دورة: ${lib.title}`,'طلب إعادة دورة جديد',`<p>${esc(u.name)} استنفد محاولات الاختبار في <b>${esc(lib.title)}</b> ويطلب إعادة الدورة.</p><p>السبب: ${esc(reason)}</p>`,'مراجعة الطلب','requests'));
  return {ok:true,retake:r};
}
function decideRetake(id,approve,note){
  if(!guard('retake.decide','قرار إعادة دورة'))return {ok:false,msg:'غير مصرّح'};
  const r=DB.retakes.find(x=>x.id===id);if(!r)return {ok:false,msg:'الطلب غير موجود'};
  if(r.status!=='pending')return {ok:false,msg:'سبق اتخاذ قرار في هذا الطلب'};
  note=String(note||'').trim();if(!approve&&note.length<3)return {ok:false,msg:'اكتب سبب الرفض'};
  const lib=libById(r.libId);
  r.status=approve?'approved':'rejected';r.decidedBy=S.me;r.decidedAt=nowISO();r.note=note;
  if(approve&&lib&&(lib.settings||{}).retakeRewatch!==false){
    allLessons(lib).forEach(l=>{const p=getProg(r.userId,l.id);if(p&&p.watched.length){(p.history=p.history||[]).push({at:nowISO(),watched:p.watched.map(x=>x.slice()),pos:p.pos,round:r.round});p.watched=[];p.pos=0;p.max=0}});
    commit('progress');
  }
  commit('retakes');audit(approve?'retake.approve':'retake.reject','retake',r.id,`${(U(r.userId)||{}).name} — ${lib?lib.title:''}`);

/* ---------- المواد المقروءة ---------- */
const readById=id=>DB.readings.find(r=>r.id===id);
const readVisible=r=>r.status==='published'&&inc(r);
const getRP=(u,r,create)=>{let p=DB.readprog.find(x=>x.id===u+'|'+r);if(!p&&create){p={id:u+'|'+r,userId:u,readingId:r,pages:{},last:1,quiz:{},tries:[],done:false,doneAt:null,startedAt:nowISO(),demo:false};DB.readprog.push(p)}return p};
const rdMin=r=>r.minDwell||DB.settings.minDwell||6;
const pageViewed=(p,n,r)=>!!p&&(p.pages[n]||0)>=rdMin(r);
function readStatus(userId,r){
  const p=getRP(userId,r.id,false);const tot=r.pages.length;
  const viewed=r.pages.filter(pg=>pageViewed(p,pg.n,r)).length;
  const secs=(r.sections||[]).map(s=>{
    const need=r.pages.filter(pg=>pg.n>=s.from&&pg.n<=s.to);
    const pagesOk=need.every(pg=>pageViewed(p,pg.n,r));
    const q=p&&p.quiz[s.id];const hasQ=(s.quiz||[]).length>0;
    return {s,pagesOk,hasQ,passed:!hasQ||!!(q&&q.passed),unlocked:pagesOk&&hasQ,best:q?q.best:null,tries:q?q.tries:0,seen:need.filter(pg=>pageViewed(p,pg.n,r)).length,total:need.length};
  });
  const allPages=viewed===tot&&tot>0,allQ=secs.every(x=>x.passed);
  return {tot,viewed,pct:tot?Math.round(viewed/tot*100):0,secs,done:!!(p&&p.done),ready:allPages&&allQ,allPages,allQ};
}
function readCheckDone(userId,r){
  const p=getRP(userId,r.id,false);if(!p||p.done)return false;
  const st=readStatus(userId,r);if(!st.ready)return false;
  p.done=true;p.doneAt=nowISO();commit('readprog');
  audit('reading.complete','readprog',p.id,`${(U(userId)||{}).name} — ${r.title}`);
  notify(userId,`اكتملت المادة: ${r.title}`,'أُضيفت المادة إلى سجلك',`<p>أكملت استعراض جميع أجزاء المادة والإجابة عن أسئلة التحقق، وأُضيفت إلى سجل أنشطتك المعتمدة.</p>`,'سجلي','record');
  return true;
}
/* يُستدعى كل ثانية عرض فعلي للصفحة: تُحتسب الثانية فقط إن كانت الصفحة ظاهرة وهناك تفاعل حديث */
function readTick(userId,r,n){
  const p=getRP(userId,r.id,true);p.pages[n]=(p.pages[n]||0)+1;p.last=n;p.updated=nowISO();
  commit('readprog');
  if(p.pages[n]===rdMin(r))readCheckDone(userId,r);
  return p.pages[n];
}
function submitReadQuiz(userId,r,secId,answers){
  const s=(r.sections||[]).find(x=>x.id===secId);if(!s)return {ok:false,msg:'الجزء غير موجود'};
  const st=readStatus(userId,r),ss=st.secs.find(x=>x.s.id===secId);
  if(!ss.pagesOk)return {ok:false,msg:'استعرض جميع صفحات هذا الجزء أولًا'};
  if(!(s.quiz||[]).length)return {ok:false,msg:'لا أسئلة لهذا الجزء'};
  if(s.quiz.some((q,i)=>answers[i]==null))return {ok:false,msg:'أجب عن جميع الأسئلة'};
  const score=gradeQuiz(s.quiz,answers),pass=r.passPct||70;
  const p=getRP(userId,r.id,true);const q=p.quiz[secId]||{best:0,tries:0,passed:false};
  q.tries++;q.best=Math.max(q.best,score);q.last=score;q.at=nowISO();if(score>=pass)q.passed=true;p.quiz[secId]=q;
  p.tries.push({sec:secId,score,at:nowISO()});commit('readprog');
  audit('reading.quiz','readprog',p.id,`${r.title} / ${s.title}: ${score}%`);
  readCheckDone(userId,r);
  return {ok:true,score,passed:score>=pass,pass,done:getRP(userId,r.id,false).done};
}

  DB.readprog.filter(inc).forEach(p=>{const r=readById(p.readingId);if(!r)return;const st=readStatus(p.userId,r);add({type:'reading',refId:r.id,userId:p.userId,title:r.title,date:(p.doneAt||p.updated||p.startedAt||'').slice(0,10),status:p.done?'completed':'inprogress',pct:st.pct,hours:0,durMin:p.done?(r.estMin||0):0,field:r.cat,demo:p.demo})});

  DB.visits.filter(inc).forEach(v=>add({type:'visit',refId:v.id,userId:v.userId,title:'زيارة: '+v.org,date:v.date||(v.at||'').slice(0,10),status:v.status,hours:0,durMin:v.status==='approved'?v.durMin:0,reqMin:v.durMin,org:v.org,at:v.at,demo:v.demo}));
  return rows;
}
const rowCounted=r=>COUNTED.includes(r.status);
function actFilter(rows,f){
  return rows.filter(r=>(!f.emp||r.userId===f.emp)&&(!f.dir||r.dirId===f.dir)&&(!f.sec||r.deptId===f.sec)&&(!f.type||r.type===f.type)&&(!f.from||(r.date||'')>=f.from)&&(!f.to||(r.date||'')<=f.to)&&(!f.status||(f.status==='counted'?rowCounted(r):r.status===f.status)));
}
const sumH=a=>Math.round(a.reduce((s,x)=>s+(x||0),0)*10)/10;
function actKPIs(f){
  const all=actFilter(actRows(),f);const C=all.filter(rowCounted);
  const by=t=>C.filter(r=>r.type===t);
  const inLib=all.filter(r=>r.type==='recorded');const libDone=inLib.filter(r=>r.status==='completed').length;
  const examU={};DB.attempts.filter(a=>inc(a)&&a.kind==='post').forEach(a=>{if(f.emp&&a.userId!==f.emp)return;const u=U(a.userId);if(!u)return;if(f.dir&&dirOf(u)!==f.dir)return;if(f.sec&&u.deptId!==f.sec)return;const d=a.at.slice(0,10);if(f.from&&d<f.from)return;if(f.to&&d>f.to)return;(examU[a.userId+'|'+a.libId]=examU[a.userId+'|'+a.libId]||[]).push(a)});
  const ex=Object.values(examU),exPass=ex.filter(a=>a.some(x=>x.passed)).length;
  const inP=(iso)=>(!f.from||(iso||'').slice(0,10)>=f.from)&&(!f.to||(iso||'').slice(0,10)<=f.to);
  const scopeU=r=>{const u=U(r.userId);return u&&(!f.emp||u.id===f.emp)&&(!f.dir||dirOf(u)===f.dir)&&(!f.sec||u.deptId===f.sec)};
  const retakes=DB.retakes.filter(r=>inc(r)&&scopeU(r)&&inP(r.at)).length;
  const extReq=DB.extreq.filter(r=>inc(r)&&scopeU(r)&&inP(r.at)).length;
  const visPend=DB.visits.filter(r=>inc(r)&&scopeU(r)&&r.status==='submitted'&&inP(r.at)).length;
  const trainHours=sumH(C.filter(r=>TRAIN_TYPES.includes(r.type)).map(r=>r.hours));
  const devMin=C.filter(r=>DEV_TYPES.includes(r.type)).reduce((s,r)=>s+(r.durMin||0),0);
  return {
    users:new Set(C.map(r=>r.userId)).size,acts:C.length,
    inperson:by('inperson').length,recorded:by('recorded').length,reading:by('reading').length,external:by('external').length,visit:by('visit').length,
    trainHours,devMin,devHours:Math.round(devMin/6)/10,
    libRate:inLib.length?{n:inLib.length,v:Math.round(libDone/inLib.length*100)}:null,
    passRate:ex.length?{n:ex.length,v:Math.round(exPass/ex.length*100)}:null,
    retakes,extReq,visPend,rows:all
  };
}

function saveReading(){
  if(!guard('reading.write'))return;const e=S.ed;const errs=[];
  e.title=(e.title||'').trim();if(!e.title)errs.push('عنوان المادة مطلوب');
  if(DB.readings.some(r=>r.id!==e.id&&r.title.trim()===e.title))errs.push('توجد مادة بالعنوان نفسه (تكرار)');
  if(!(e.minDwell>=2&&e.minDwell<=120))errs.push('الحد الأدنى لعرض الصفحة بين 2 و120 ثانية');
  if(!(e.passPct>=1&&e.passPct<=100))errs.push('درجة الاجتياز بين 1 و100');
  if(!(e.estMin>=1))errs.push('الزمن التقديري غير صالح');
  if(!e.pages.length)errs.push('ارفع ملف المادة أو أدخل رابطًا صالحًا وتحقق منه');
  const n=e.pages.length;
  e.sections.forEach((s,i)=>{if(!(s.title||'').trim())errs.push(`الجزء ${i+1}: العنوان مطلوب`);if(!(s.from>=1&&s.to>=s.from&&s.to<=n))errs.push(`الجزء ${i+1}: نطاق الصفحات غير صالح (1–${n})`);
    (s.quiz||[]).forEach((q,j)=>{if(!(q.q||'').trim())errs.push(`الجزء ${i+1}/سؤال ${j+1}: نص السؤال مطلوب`);if(q.o.filter(o=>(o||'').trim()).length<2)errs.push(`الجزء ${i+1}/سؤال ${j+1}: خياران على الأقل`);if(!(q.o[q.ans]||'').trim())errs.push(`الجزء ${i+1}/سؤال ${j+1}: الإجابة الصحيحة غير محددة`)})});
  if(e.status==='published'&&!(e.rights.source||'').trim())errs.push('لا تُنشر المادة قبل توثيق مصدرها وجهة الحقوق');
  if(errs.length){toast('تعذّر الحفظ',errs[0]);return}
  if(e.id){DB.readings[DB.readings.findIndex(r=>r.id===e.id)]=e;audit('reading.update','reading',e.id,e.title)}else{e.id=uid('rd');DB.readings.push(e);audit('reading.create','reading',e.id,e.title)}
  commit('readings');S.ed=null;S.edKind=null;closeLayer();toast('تم حفظ المادة');draw();
}
async function getAssets(){try{return window.claude&&claude.use?await claude.use('assets'):null}catch(x){return null}}
async function probePdf(url){
  await loadScript(CDN.pdfjs);const lib=window.pdfjsLib;
  if(!RD.workerUrl){const t=await (await fetch(CDN.pdfWorker)).text();RD.workerUrl=URL.createObjectURL(new Blob([t],{type:'text/javascript'}))}
  lib.GlobalWorkerOptions.workerSrc=RD.workerUrl;const d=await lib.getDocument({url}).promise;return d.numPages;
}
function setPdfPages(n){const e=S.ed;e.pages=Array.from({length:n},(_,i)=>({n:i+1}));e.sections.forEach(s=>{if(s.to>n)s.to=n;if(s.from>n)s.from=1});if(e.sections.length===1&&e.sections[0].to===1)e.sections[0].to=n}
async function uploadReadPdf(f){
  if(!f)return;if(f.type!=='application/pdf'){toast('الملف يجب أن يكون PDF');return}
  if(f.size>20*1048576){toast('الحجم يتجاوز 20 م.ب','استخدم رابط ملف مستضاف لدى الجمعية');return}
  const A=await getAssets();if(!A){toast('الرفع إلى استضافة المنصة غير متاح لحسابك','متاح لمالك المنصة/المحرّرين؛ استخدم رابط PDF مستضاف');return}
  try{const r=await A.upload(f);S.ed.pdfAsset=r.id;S.ed.pdfUrl='/_blob/'+r.id;const n=await probePdf(S.ed.pdfUrl);setPdfPages(n);toast('تم رفع الملف',`${n} صفحة`);rerenderEd()}
  catch(e){toast('تعذّر الرفع',(e&&(e.code||e.message))||'')}
}
async function probeReadUrl(){
  const u=(S.ed.pdfUrl||'').trim();if(!/^(https:\/\/|\/_blob\/|\.\/|[\w\-\/]+\.pdf$)/i.test(u)){toast('الرابط يجب أن يبدأ بـ https://');return}
  try{const n=await probePdf(u);setPdfPages(n);toast('تم التحقق من الملف',`${n} صفحة`);rerenderEd()}catch(e){toast('تعذّر فتح الملف',(e&&e.message)||'')}
}

/* ---------- رفع الفيديو والصورة التعريفية في محرر الدورة ---------- */
const VID_OK=['video/mp4','video/webm'];
function probeVideoDur(f){return new Promise(res=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{res(Math.ceil(v.duration)||0);URL.revokeObjectURL(v.src)};v.onerror=()=>res(0);v.src=URL.createObjectURL(f)})}
async function uploadLessonVideo(mi,li,f){
  if(!f)return;if(!VID_OK.includes(f.type)){toast('صيغة غير مدعومة','MP4 أو WebM فقط');return}
  if(f.size>20*1048576){toast('حجم الفيديو يتجاوز 20 م.ب (حد استضافة المنصة)','للملفات الأكبر استخدم رابط ملف مستضاف لدى الجمعية (انظر دليل التشغيل)');return}
  const A=await getAssets();if(!A){toast('الرفع إلى استضافة المنصة غير متاح لحسابك','متاح لمالك المنصة/المحرّرين؛ استخدم رابط ملف فيديو مستضاف');return}
  toast('جارٍ رفع الفيديو…');
  try{const dur=await probeVideoDur(f);if(!dur){toast('تعذّر قراءة مدة الفيديو','الملف قد يكون تالفًا');return}
    const r=await A.upload(f);const l=S.ed.modules[mi].lessons[li];l.src='asset';l.assetId=r.id;l.url='/_blob/'+r.id;l.dur=dur;l.sizeBytes=r.sizeBytes;l.fileName=f.name;toast('تم رفع الفيديو',`${dur} ثانية`);rerenderEd()}
  catch(e){toast('تعذّر الرفع',(e&&(e.code||e.message))||'')}
}
function resizeImage(f,max=480){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.78))};img.onerror=()=>rej(new Error('img'));img.src=URL.createObjectURL(f)})}
async function pickCover(f){
  if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast('الصورة يجب أن تكون JPG أو PNG');return}
  if(f.size>5*1048576){toast('حجم الصورة كبير (الحد 5 م.ب)');return}
  try{S.ed.cover=await resizeImage(f);rerenderEd()}catch(e){toast('تعذّرت قراءة الصورة')}
}

   }});

function ytStartPoll(){
  clearInterval(PL.ytTimer);
  PL.ytTimer=setInterval(()=>{
    const yt=PL.yt,p=PL.p,les=PL.les;if(!yt||!p||!les||typeof yt.getCurrentTime!=='function')return;
    let ct,state;try{ct=yt.getCurrentTime();state=yt.getPlayerState()}catch(e){return}
    PL.ytCt=ct;
    if(state!==1){PL.yPrev=null;return}
    const now=performance.now();
    try{const r=yt.getPlaybackRate();if(r>PL.maxRate+1e-9)yt.setPlaybackRate(PL.maxRate)}catch(e){}
    if(PL.yPrev){
      const dv=ct-PL.yPrev.ct,dw=(now-PL.yPrev.t)/1000;
      /* تقدّم الفيديو يجب أن يطابق الزمن الفعلي؛ غير ذلك = قفز أو تلاعب ولا يُحتسب */
      if(dv<-0.25||dv>dw*PL.maxRate+1.2){PL.yPrev={ct,t:now};PL.lastCt=null;PL.segStart=ct;ytCheckForward(ct);updatePlayerUI();return}
    }
    PL.yPrev={ct,t:now};
    if(ytCheckForward(ct))return;
    tickTo(ct);updatePlayerUI();
  },500);
}
function ytCheckForward(ct){
  const p=PL.p,les=PL.les;if(!p||!les)return false;
  const limit=PL.doneBefore?Infinity:Math.max(p.max||0,0)+1.5;
  if(!PL.fwd&&ct>limit){p.blocked=(p.blocked||0)+1;try{PL.yt.seekTo(Math.min(p.max||0,les.dur),true)}catch(e){}PL.yPrev=null;PL.lastCt=null;toast('لا يمكن تخطي المحتوى','يلزم مشاهدة الدرس بالتسلسل حتى يُحتسب');audit('seek.blocked','lesson',les.id,`إلى ${Math.round(ct)}ث`);return true}
  return false;
}
function ytDetach(){clearInterval(PL.ytTimer);PL.ytTimer=null;if(PL.yt){try{PL.yt.pauseVideo()}catch(e){}try{PL.yt.destroy()}catch(e){}}PL.yt=null;PL.yPrev=null}

function scopeEmps(deptId){return allEmployees().filter(u=>!deptId||u.deptId===deptId||dirOfDept(u.deptId)===deptId)}
function computeKPIs(deptId,year){
  const emps=scopeEmps(deptId),ids=new Set(emps.map(e=>e.id)),Y=String(year||TODAY().slice(0,4));
  const comps=DB.completions.filter(c=>inc(c)&&ids.has(c.userId)&&c.date.slice(0,4)===Y);
  const out={};const put=(id,v,n,min,unit,extra)=>{out[id]={id,v,n,min,unit,ok:v!=null&&n>=min&&isFinite(v),extra:extra||''}};
  const plans=DB.plans.filter(p=>p.year===+Y&&inc(p));const pst=plans.map(p=>planStats(p.id));
  const act=sum(pst.map(s=>s.act)),ex=sum(pst.map(s=>s.ex));put('exec',act?ex/act*100:null,act,1,'%',`${ex} من ${act}`);
  const cov=new Set(comps.map(c=>c.userId)).size;put('cover',emps.length?cov/emps.length*100:null,emps.length,3,'%',`${cov} من ${emps.length}`);
  put('hours',emps.length?sum(comps.map(c=>c.hours))/emps.length:null,emps.length,3,'ساعة',`${num(sum(comps.map(c=>c.hours)))} ساعة / ${emps.length} موظف`);
  const elig=DB.enrolls.filter(e=>inc(e)&&ids.has(e.userId)&&['completed','attended','absent','registered'].includes(e.status)&&(courseById(e.courseId)||{date:'9'}).date<TODAY()&&(courseById(e.courseId)||{date:''}).date.slice(0,4)===Y);
  const started=new Set(DB.progress.filter(p=>inc(p)&&ids.has(p.userId)).map(p=>{const l=DB.libs.find(l=>allLessons(l).some(x=>x.id===p.lessonId));return l?p.userId+'|'+l.id:null}).filter(Boolean));
  const passedL=[...started].filter(k=>{const [u,l]=k.split('|');return libPassed(u,l)}).length;
  const den=elig.length+started.size,num_=elig.filter(e=>e.status==='completed').length+passedL;put('compl',den?num_/den*100:null,den,5,'%',`${num_} من ${den}`);
  const att=DB.attempts.filter(a=>inc(a)&&ids.has(a.userId)&&a.kind==='post');const grp={};att.forEach(a=>{const k=a.userId+'|'+a.libId;grp[k]=grp[k]||{p:false};if(a.passed)grp[k].p=true});
  const gk=Object.values(grp);put('pass',gk.length?gk.filter(g=>g.p).length/gk.length*100:null,gk.length,3,'%',`${gk.filter(g=>g.p).length} من ${gk.length}`);
  const sv=DB.surveys.filter(s=>inc(s)&&ids.has(s.userId));put('sat',sv.length?avg(sv.map(surveyPct)):null,sv.length,5,'%',`ن=${sv.length}`);
  const pr=learningPairs().filter(p=>ids.has(p.userId));put('learn',pr.length?avg(pr.map(p=>p.gain)):null,pr.length,3,'نقطة',`${pr.length} زوج`);
  const evs=DB.mgrEvals.filter(e=>inc(e)&&ids.has(e.userId));put('apply',evs.length?evs.filter(e=>e.rating>=4).length/evs.length*100:null,evs.length,3,'%',`${evs.filter(e=>e.rating>=4).length} من ${evs.length}`);
  const progs=plans.flatMap(p=>DB.programs.filter(x=>x.planId===p.id&&inc(x)&&x.status==='منفذ'&&x.approved));
  const cost=sum(progs.map(p=>p.costActual));const pc=DB.completions.filter(c=>c.kind==='c'&&inc(c)&&ids.has(c.userId)&&progs.some(p=>p.courseId===c.refId));
  const trained=new Set(pc.map(c=>c.userId)).size,hrsDel=sum(pc.map(c=>c.hours));
  put('cpe',cost>0&&trained?cost/trained:null,trained,3,'ر.س',`${num(cost)} ر.س / ${trained}`);

  const gaps=DB.assess.filter(a=>inc(a)&&ids.has(a.empId)&&a.history&&a.history.length>=2).map(a=>{const u=U(a.empId),j=u&&jobById(u.jobId),jc=j&&j.comps.find(c=>c.compId===a.compId);return jc&&a.history[0].level<jc.req?{closed:a.mgr>=jc.req}:null}).filter(Boolean);
  put('gap',gaps.length?gaps.filter(g=>g.closed).length/gaps.length*100:null,gaps.length,3,'%',`${gaps.filter(g=>g.closed).length} من ${gaps.length}`);

const CDN={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',h2c:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',pdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',qr:'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',pdfjs:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfWorker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'};

async function exportTable(base,sheets,fmtx){

    wb.Workbook={Views:[{RTL:true}]};

  }catch(e){
    toast('تعذّر تحميل مكتبة Excel','صُدّر الملف بصيغة CSV بدلًا منها');

async function exportPdfEl(sel,name){
  const el=$(sel);if(!el){toast('لا محتوى للتصدير');return}
  audit('export','report',name,'pdf');
  try{
    await Promise.all([loadScript(CDN.h2c),loadScript(CDN.pdf)]);
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:canvas.width>canvas.height?'l':'p',unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=24,iw=pw-2*m,ih=canvas.height*iw/canvas.width;
    let y=0;const pageH=(ph-2*m)*canvas.width/iw;
    while(y<canvas.height){
      const sl=document.createElement('canvas');sl.width=canvas.width;sl.height=Math.min(pageH,canvas.height-y);
      sl.getContext('2d').drawImage(canvas,0,y,canvas.width,sl.height,0,0,canvas.width,sl.height);
      if(y>0)pdf.addPage();pdf.addImage(sl.toDataURL('image/jpeg',.92),'JPEG',m,m,iw,sl.height*iw/canvas.width);y+=pageH;
    }
    await saveFile(name,pdf.output('blob'));
  }catch(e){toast('تعذّر إنشاء PDF','استخدم الطباعة من المتصفح (Ctrl+P) كبديل')}
}

function saveUser(){

const sizeOf=c=>JSON.stringify(c==='settings'?[DB.settings]:DB[c]).length;
function integrity(){
  const uids=new Set(DB.users.map(u=>u.id)),cids=new Set(DB.courses.map(c=>c.id)),lids=new Set(DB.libs.map(l=>l.id)),lessIds=new Set(DB.libs.flatMap(l=>allLessons(l).map(x=>x.id))),comps=new Set(DB.comps.map(c=>c.id));
  const issues=[];const add=(k,label,arr,fix)=>{if(arr.length)issues.push({k,label,n:arr.length,fix})};
  const em={};DB.users.forEach(u=>{const k=u.email.toLowerCase();em[k]=(em[k]||0)+1});
  add('dupemail','بريد مكرر بين المستخدمين (يحتاج معالجة يدوية)',Object.entries(em).filter(([,n])=>n>1),null);
  add('enr','تسجيلات تشير إلى مستخدم أو دورة غير موجودة',DB.enrolls.filter(e=>!uids.has(e.userId)||!cids.has(e.courseId)),()=>{DB.enrolls=DB.enrolls.filter(e=>uids.has(e.userId)&&cids.has(e.courseId));commit('enrolls')});
  add('cmp','إنجازات تشير إلى مستخدم أو مصدر غير موجود',DB.completions.filter(c=>!uids.has(c.userId)||!(c.kind==='l'?lids:cids).has(c.refId)),()=>{DB.completions=DB.completions.filter(c=>uids.has(c.userId)&&(c.kind==='l'?lids:cids).has(c.refId));commit('completions')});
  add('prg','سجلات تقدم لدروس أو مستخدمين غير موجودين',DB.progress.filter(p=>!uids.has(p.userId)||!lessIds.has(p.lessonId)),()=>{DB.progress=DB.progress.filter(p=>uids.has(p.userId)&&lessIds.has(p.lessonId));commit('progress')});
  add('att','محاولات اختبار لدورات غير موجودة',DB.attempts.filter(a=>!lids.has(a.libId)||!uids.has(a.userId)),()=>{DB.attempts=DB.attempts.filter(a=>lids.has(a.libId)&&uids.has(a.userId));commit('attempts')});
  add('ass','تقييمات كفايات لكفاية أو موظف غير موجود',DB.assess.filter(a=>!comps.has(a.compId)||!uids.has(a.empId)),()=>{DB.assess=DB.assess.filter(a=>comps.has(a.compId)&&uids.has(a.empId));commit('assess')});
  add('mgr','رئيس مباشر غير موجود',DB.users.filter(u=>u.managerId&&!uids.has(u.managerId)),()=>{DB.users.forEach(u=>{if(u.managerId&&!uids.has(u.managerId))u.managerId=null});commit('users')});
  add('seat','دورات يتجاوز مسجلوها عدد المقاعد',DB.courses.filter(c=>c.seats!=null&&seatsUsed(c.id)>c.seats),null);
  add('pg','برامج تشير إلى دورة غير موجودة',DB.programs.filter(p=>p.courseId&&!cids.has(p.courseId)),()=>{DB.programs.forEach(p=>{if(p.courseId&&!cids.has(p.courseId))p.courseId=null});commit('programs')});
  return issues;
}

async function pickRestore(file){
  if(!guard('backup'))return;if(!file)return;

  const err=!d||d.app!=='qb-training'?'الملف ليس نسخة احتياطية من هذه المنصة':!d.settings?'بنية الملف ناقصة (settings)':(d.schemaV||0)>(DB.settings.schemaV||2)?'نسخة الملف أحدث من المنصة':COLS.find(c=>c!=='audit'&&!Array.isArray(d[c]))?'مجموعة مفقودة أو تالفة: '+COLS.find(c=>c!=='audit'&&!Array.isArray(d[c])):!(d.users||[]).some(u=>(u.roles||[]).includes('sysadmin'))?'لا يوجد مسؤول نظام في النسخة':'';

}
function doRestore(){

/* ================= منشئ التقارير: الفترة × النطاق × التصدير ================= */
// مدير التدريب: الجمعية كاملة أو أي إدارة أو قسم أو موظف.
// الرئيس المباشر (مدير الإدارة/القسم): قسمه ومن يتبعونه فقط.
(function(){
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function presetRange(p){
  const t=parseD(TODAY()),y=t.getFullYear(),m=t.getMonth();
  const wkStart=new Date(t);wkStart.setDate(t.getDate()-t.getDay()); // الأسبوع يبدأ الأحد
  switch(p){
    case 'week':return [isoD(wkStart),isoD(t)];
    case 'lastweek':{const e=new Date(wkStart);e.setDate(e.getDate()-1);const s=new Date(e);s.setDate(e.getDate()-6);return [isoD(s),isoD(e)]}
    case 'month':return [isoD(new Date(y,m,1)),isoD(t)];
    case 'lastmonth':return [isoD(new Date(y,m-1,1)),isoD(new Date(y,m,0))];
    case 'quarter':return [isoD(new Date(y,Math.floor(m/3)*3,1)),isoD(t)];
    case 'year':return [y+'-01-01',isoD(t)];
    case 'lastyear':return [(y-1)+'-01-01',(y-1)+'-12-31'];
    default:return null;
  }
}
const PRESETS=[['week','هذا الأسبوع'],['lastweek','الأسبوع الماضي'],['month','هذا الشهر'],['lastmonth','الشهر الماضي'],['quarter','هذا الربع'],['year','هذا العام'],['lastyear','العام الماضي'],['custom','فترة مخصّصة']];
const SCOPES=[['org','الجمعية كاملة'],['dir','إدارة'],['sec','قسم'],['user','موظف']];

// من يحق للمستخدم الحالي رؤية تقاريرهم
function allowedEmps(){
  const all=allEmployees();
  if(S.role==='trainmgr')return all;
  const me=ME();if(!me)return [];
  const reports=new Set([me.id]);let grew=true;
  while(grew){grew=false;for(const u of DB.users)if(u.managerId&&reports.has(u.managerId)&&!reports.has(u.id)){reports.add(u.id);grew=true}}
  return all.filter(u=>reports.has(u.id)||(u.deptId&&u.deptId===me.deptId));
}
function scopeOptions(){
  const emps=allowedEmps(),secIds=new Set(emps.map(u=>u.deptId).filter(Boolean));
  const secs=DB.depts.filter(d=>inc(d)&&d.type!=='dir'&&secIds.has(d.id));
  const dirs=DB.depts.filter(d=>inc(d)&&d.type==='dir'&&(S.role==='trainmgr'||secs.some(s=>s.parent===d.id&&DB.depts.filter(x=>x.parent===d.id).every(x=>secIds.has(x.id)))));
  const scopes=S.role==='trainmgr'?SCOPES:SCOPES.filter(([k])=>k!=='org'&&(k!=='dir'||dirs.length));
  return {emps,secs,dirs,scopes};
}
function rbState(){
  if(!S.rb){
    const o=scopeOptions(),r=presetRange('month');
    S.rb={preset:'month',from:r[0],to:r[1],scope:S.role==='trainmgr'?'org':'sec',dir:(o.dirs[0]||{}).id||'',sec:(o.secs[0]||{}).id||'',user:(o.emps[0]||{}).id||''};
  }
  return S.rb;
}
function scopeEmpsRb(f){
  const emps=allowedEmps();
  if(f.scope==='org')return emps;
  if(f.scope==='dir')return emps.filter(u=>dirOfDept(u.deptId)===f.dir||u.deptId===f.dir);
  if(f.scope==='sec')return emps.filter(u=>u.deptId===f.sec);
  return emps.filter(u=>u.id===f.user);
}
const scopeLabel=f=>f.scope==='org'?'الجمعية كاملة':f.scope==='dir'?deptName(f.dir):f.scope==='sec'?deptName(f.sec):((U(f.user)||{}).name||'—');
const inR=(d,f)=>d&&d.slice(0,10)>=f.from&&d.slice(0,10)<=f.to;
const refTitle=c=>((c.kind==='c'?DB.courses.find(x=>x.id===c.refId)||DB.programs.find(x=>x.id===c.refId):c.kind==='l'?DB.libs.find(x=>x.id===c.refId):DB.readings.find(x=>x.id===c.refId))||{}).title||'—';
const KIND={c:'دورة حضورية',l:'المكتبة الإلكترونية',r:'مادة مقروءة'};

function compute(f){
  const emps=scopeEmpsRb(f),ids=new Set(emps.map(u=>u.id));
  const rows=[],acts=[];
  for(const u of emps){
    const cs=DB.completions.filter(c=>c.userId===u.id&&inc(c)&&inR(c.date,f));
    const ex=DB.extreq.filter(x=>x.userId===u.id&&x.status==='approved'&&inc(x)&&inR(x.date,f));
    const vs=DB.visits.filter(v=>v.userId===u.id&&v.status==='approved'&&inc(v)&&inR(v.date,f));
    const en=DB.enrolls.filter(e=>e.userId===u.id&&inc(e)&&!['cancelled','canceled','withdrawn','rejected'].includes(e.status)).map(e=>({e,c:DB.courses.find(c=>c.id===e.courseId)})).filter(x=>x.c&&inR(x.c.date,f)&&x.c.date<=TODAY());
    const pre=DB.tests.filter(t=>t.userId===u.id&&inc(t)&&t.kind==='pre'&&inR(t.at,f)),post=DB.tests.filter(t=>t.userId===u.id&&inc(t)&&t.kind==='post'&&inR(t.at,f));
    const sv=DB.surveys.filter(s=>s.userId===u.id&&inc(s)&&inR(s.at,f));
    const me=DB.mgrEvals.filter(m=>m.userId===u.id&&inc(m)&&inR(m.at,f));
    const h={c:sum(cs.filter(c=>c.kind==='c').map(c=>c.hours)),l:sum(cs.filter(c=>c.kind==='l').map(c=>c.hours)),r:sum(cs.filter(c=>c.kind!=='c'&&c.kind!=='l').map(c=>c.hours)),x:sum(ex.map(x=>x.hours))};
    const att=en.filter(x=>x.e.att===true||x.e.status==='completed').length;
    rows.push({u,h,total:h.c+h.l+h.r+h.x,courses:cs.filter(c=>c.kind==='c').length,libs:cs.filter(c=>c.kind==='l').length,ext:ex.length,visits:vs.length,
      enr:en.length,att,pre:pre.length?avg(pre.map(t=>t.score)):null,post:post.length?avg(post.map(t=>t.score)):null,postN:post.length,
      sat:sv.length?avg(sv.map(surveyPct)):null,satN:sv.length,imp:me.length?avg(me.map(m=>m.rating)):null,impN:me.length,certs:cs.filter(c=>c.cert).length});
    cs.forEach(c=>acts.push({date:c.date,u,type:KIND[c.kind]||'إنجاز',title:refTitle(c),hours:c.hours}));
    ex.forEach(x=>acts.push({date:x.date,u,type:'دورة خارجية معتمدة',title:x.title+(x.provider?' — '+x.provider:''),hours:x.hours}));
    vs.forEach(v=>acts.push({date:v.date,u,type:'زيارة ميدانية معتمدة',title:v.org||'—',hours:null}));
  }
  rows.sort((a,b)=>b.total-a.total);acts.sort((a,b)=>b.date.localeCompare(a.date));
  const T=k=>sum(rows.map(r=>r[k])),H=k=>sum(rows.map(r=>r.h[k]));
  const allPre=rows.filter(r=>r.pre!=null),allPost=rows.filter(r=>r.post!=null);
  const wAvg=(arr,v,n)=>{const tot=sum(arr.map(r=>r[n]||1));return tot?sum(arr.map(r=>r[v]*(r[n]||1)))/tot:null};
  const sum_={emps:rows.length,total:T('total'),hc:H('c'),hl:H('l'),hr:H('r'),hx:H('x'),courses:T('courses'),libs:T('libs'),ext:T('ext'),visits:T('visits'),enr:T('enr'),att:T('att'),certs:T('certs'),
    active:rows.filter(r=>r.total>0).length,
    pre:allPre.length?avg(allPre.map(r=>r.pre)):null,post:allPost.length?wAvg(allPost,'post','postN'):null,postN:T('postN'),
    sat:rows.some(r=>r.sat!=null)?wAvg(rows.filter(r=>r.sat!=null),'sat','satN'):null,satN:T('satN'),
    imp:rows.some(r=>r.imp!=null)?wAvg(rows.filter(r=>r.imp!=null),'imp','impN'):null,impN:T('impN')};
  // تجميع حسب القسم
  const bySec={};
  for(const r of rows){const k=r.u.deptId||'—';(bySec[k]=bySec[k]||{id:k,n:0,total:0,courses:0,ext:0,active:0,sat:[],}).n++;const g=bySec[k];g.total+=r.total;g.courses+=r.courses+r.libs;g.ext+=r.ext;if(r.total>0)g.active++;if(r.sat!=null)g.sat.push(r.sat)}
  const secs=Object.values(bySec).map(g=>({...g,name:deptName(g.id),dir:deptName(dirOfDept(g.id)),avgH:g.n?g.total/g.n:0,sat:g.sat.length?avg(g.sat):null})).sort((a,b)=>b.total-a.total);
  return {rows,acts,sum:sum_,secs,ids};
}

const empN=n=>n===1?'موظف واحد':n===2?'موظفان':(n%100>=3&&n%100<=10)?N(n)+' موظفين':N(n)+' موظفًا';
const actN=n=>n===1?'نشاط واحد':n===2?'نشاطان':(n%100>=3&&n%100<=10)?N(n)+' أنشطة':N(n)+' نشاطًا';
const pct=(a,b)=>b?Math.round(a/b*100):null;
const nOr=(v,d=0,suf='')=>v==null?'—':num(v,d)+suf;
