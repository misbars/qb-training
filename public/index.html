const relDay=d=>{const t=new Date(TODAY()+'T00:00:00'),x=new Date(d+'T00:00:00');const n=Math.round((x-t)/864e5);return n===0?'اليوم':n===1?'بكرة':n===2?'بعد بكرة':n<=10?`بعد ${n} أيام`:`بعد ${n} يومًا`};
function empTasks(u){
  const T=[];
  // دورات قريبة (خلال 7 أيام)
  DB.enrolls.filter(e=>e.userId===u.id&&e.status==='registered').map(e=>({e,c:courseById(e.courseId)})).filter(x=>x.c&&x.c.date>=TODAY()&&x.c.fmt!=='ذاتي'&&(new Date(x.c.date)-new Date(TODAY()))/864e5<=7).sort((a,b)=>a.c.date.localeCompare(b.c.date))
    .forEach(({c})=>T.push({kind:'course',date:c.date,title:c.title,sub:`${dow(c.date)} ${fmt(c.date)}${c.time?' · '+c.time:''}${c.loc?' · '+c.loc:''}`,btn:'التفاصيل',act:'go',v:'my-learning'}));
  // طلبات ردّها الرئيس أو مدير التدريب
  DB.visits.filter(v=>v.userId===u.id&&v.status==='returned'&&inc(v)).forEach(v=>T.push({kind:'returned',title:`${(U(u.managerId)||{name:'رئيسك'}).name.split(' ')[0]} رجّع زيارتك`,sub:v.mgrNote?`«${v.mgrNote}»`:'افتحها وعدّلها حسب الملاحظة',btn:'عدّلها',act:'emp-visit',id:v.id}));
  DB.extreq.filter(x=>x.userId===u.id&&x.status==='returned'&&inc(x)).forEach(x=>T.push({kind:'returned',title:'رجّعت إدارة التدريب دورتك الخارجية',sub:x.title,btn:'عدّلها',act:'go',v:'devp'}));
  // كمّل دورة مسجّلة
  DB.libs.filter(l=>l.status==='published'&&inc(l)&&DB.progress.some(p=>p.userId===u.id&&allLessons(l).some(x=>x.id===p.lessonId))&&!libPassed(u.id,l.id)).forEach(l=>{
    const pc=libPct(u.id,l);const att=attemptsOf(u.id,l.id,'post').length,max=(l.settings||{}).maxAttempts||3;
    const pendRetake=DB.retakes.some(r=>r.userId===u.id&&r.libId===l.id&&['pending','pending_tm'].includes(r.status));
    if(pc>=100&&att>=max){T.push({kind:'retake',title:`خلصت محاولات اختبار «${l.title}»`,sub:pendRetake?'طلب الإعادة عند إدارة التدريب، وبيوصلك إشعار بالقرار':'تقدر تطلب إعادة الدورة',btn:pendRetake?null:'اطلب إعادة',act:'openlib',id:l.id})}
    else if(pc>=100){T.push({kind:'exam',title:`اختبار «${l.title}» جاهز`,sub:`خلصت الدروس، باقي الاختبار (${max-att} ${max-att===1?'محاولة متبقية':'محاولات متبقية'})`,btn:'ابدأ',act:'openlib',id:l.id,primary:true})}
    else T.push({kind:'continue',title:`كمّل «${l.title}»`,sub:`وصلت ${pc}%`,pct:pc,btn:'كمّل',act:'openlib',id:l.id,primary:true});
  });
  // تقييم الدورات المكتملة
  DB.completions.filter(c=>c.userId===u.id&&!surveyOf(u.id,c.kind,c.refId)).slice(0,2).forEach(c=>T.push({kind:'survey',title:`قيّم «${titleOf(c.kind,c.refId)}»`,sub:'دقيقتين، ورأيك يحسّن الدورات',btn:'قيّم',act:'rate',dkind:c.kind,id:c.refId}));
  // تقييم المهارات
  const nGap=gapsOfEmp(u).filter(g=>g.state==='unrated'||(g.a&&g.a.self==null)).length;
  if(nGap)T.push({kind:'skills',title:'قيّم مهاراتك',sub:`${nGap} ${nGap===1?'مهارة':nGap===2?'مهارتان':nGap<=10?'مهارات':'مهارة'} تنتظر تقييمك، وعليها نقترح لك الدورات`,btn:'قيّم',act:'go',v:'selfassess'});
  // طلبات تنتظر غيرك (للعلم فقط)
  DB.enrolls.filter(e=>e.userId===u.id&&['pending_lm','pending_tm'].includes(e.status)).forEach(e=>{const c=courseById(e.courseId);if(!c)return;const who=e.status==='pending_lm'?(U(u.managerId)||{name:'رئيسك'}).name.split(' ')[0]:'إدارة التدريب';T.push({kind:'wait',title:`ننتظر موافقة ${who}`,sub:`على تسجيلك في «${c.title}». بيوصلك إشعار بالقرار.`})});
  DB.extreq.filter(x=>x.userId===u.id&&['pending','submitted'].includes(x.status)&&inc(x)).forEach(x=>T.push({kind:'wait',title:'ننتظر اعتماد إدارة التدريب',sub:`لدورتك الخارجية «${x.title}»`}));
  DB.visits.filter(v=>v.userId===u.id&&['pending','pending_lm','submitted'].includes(v.status)&&inc(v)).forEach(v=>T.push({kind:'wait',title:`ننتظر موافقة ${(U(u.managerId)||{name:'رئيسك'}).name.split(' ')[0]}`,sub:`على زيارتك لـ «${v.org||'جهة'}»`}));
  return T;
}
const TASK_ICON={course:['cal','#072C49','#fff'],returned:['rotate','#F8E4DF','#8F3B2B'],continue:['play','#D3EEF3','#007497'],exam:['check','#D3EEF3','#007497'],retake:['rotate','#FBEFD9','#8A5C12'],survey:['smile','#F7E7D4','#7A4A18'],skills:['target','#EAF6F9','#007497'],wait:['clock','#F0ECE4','#47596A']};
function taskCard(t){
  const [ic,bg,fg]=TASK_ICON[t.kind]||TASK_ICON.wait;
  const badge=t.kind==='course'?`<div class="tk-date" style="background:${bg};color:${fg}"><span>${relDay(t.date)}</span><b class="num">${+t.date.slice(8,10)}</b></div>`:`<div class="tk-ic" style="background:${bg};color:${fg}">${ico(ic)}</div>`;
  const btn=t.btn?`<button class="btn ${t.primary?'':'ghost'} tk-btn" data-act="${t.act}"${t.v?` data-v="${t.v}"`:''}${t.id?` data-id="${t.id}"`:''}${t.dkind?` data-kind="${t.dkind}"`:''}>${t.btn}</button>`:'';
  return `<article class="card tk ${t.kind==='returned'?'tk-alert':''} ${t.kind==='wait'?'tk-wait':''}">${badge}<div class="tk-body"><b>${esc(t.title)}</b><span>${esc(t.sub||'')}</span>${t.pct!=null?`<div class="tk-bar"><i style="width:${t.pct}%"></i></div>`:''}</div>${btn}</article>`;
}
VIEWS.home=function(){
  const u=ME();if(!u)return '';
  const h=hoursOf(u.id,TODAY().slice(0,4)+'-01-01'),p=Math.round(h/TARGET_H*100);
  const T=empTasks(u),act=T.filter(t=>t.kind!=='wait'),wait=T.filter(t=>t.kind==='wait');
  const rec=recommendedFor(u).slice(0,3);
  const certs=DB.completions.filter(c=>c.userId===u.id&&inc(c)).length;
  const n=act.length;
  return `<div class="emp-home">
  <div class="emp-head"><div><h1>هلا ${esc(u.name.split(' ')[0])}</h1><p>${n?`عندك <b>${n===1?'شي واحد':n===2?'شيئين':n+' أشياء'}</b> ${n===1?'يحتاجك':'تحتاجك'}`:'ما عندك شي مطلوب الحين'}</p></div>
   <button class="btn gold" data-act="emp-add">${ico('plus')}أضف إنجاز</button></div>
  <div class="emp-cols">
   <section class="emp-tasks" aria-label="المطلوب منك">
    ${act.length?act.map(taskCard).join(''):`<div class="card empty" style="padding:32px">${ico('check')}<div><b style="color:var(--navy)">كل شي تمام</b><div class="small muted" style="margin-top:4px">تصفح الدورات المتاحة لو تبي تتعلّم شي جديد.</div></div><button class="btn" style="margin-top:12px" data-act="go" data-v="opportunities">تصفح الدورات</button></div>`}
    ${wait.length?`<h2 class="emp-h2">ننتظر غيرك</h2>${wait.map(taskCard).join('')}`:''}
   </section>
   <aside class="emp-side">
    <section class="card emp-prog" aria-label="تقدّمك هذا العام">
     <div class="ring" style="--p:${Math.min(100,p)}"><div><div><b class="num">${p}%</b></div></div></div>
     <div><b class="emp-prog-t">${h>=TARGET_H?'حققت مستهدفك السنوي':`باقي ${num(Math.max(0,TARGET_H-h))} ساعة على مستهدفك`}</b><span><bdi class="num">${num(h)}</bdi> من ${TARGET_H} ساعة هذا العام · ${certs} ${certs===1?'شهادة':certs===2?'شهادتان':certs<=10?'شهادات':'شهادة'}</span><button class="linkbtn" data-act="go" data-v="record">عرض سجلي</button></div>
    </section>
    ${rec.length?`<section class="card pad emp-rec"><h2 class="emp-h2" style="margin:0 0 8px">مقترح لك</h2>${rec.map(({c})=>`<button class="emp-rec-i" data-act="go" data-v="opportunities"><b>${esc(c.title)}</b><span>${dow(c.date)} ${fmt(c.date)} · ${esc(c.fmt||'')} · <bdi class="num">${num(c.hours)}</bdi> ${c.hours>2&&c.hours<11?'ساعات':'ساعة'}</span></button>`).join('')}<button class="linkbtn" data-act="go" data-v="opportunities">كل الدورات</button></section>`:''}
   </aside>
  </div></div>`;
};

/* ---------- البيانات ---------- */
function trConf() { return DB.tracks.find(t => t.id === TRACK.id) || { id: TRACK.id, extra: [], off: [] } }
function isLeader(u) {
  if (!u || u.active === false) return false;
  const c = trConf();
  if ((c.off || []).includes(u.id)) return false;
  return (u.roles || []).includes('linemgr') || (c.extra || []).includes(u.id);
}
const trLeaders = () => DB.users.filter(u => inc(u) && isLeader(u));
const trProg = uid => DB.trackprog.find(p => p.userId === uid && p.track === TRACK.id);
function trMine() {
  let p = trProg(S.me);
  if (!p) { p = { id: 'tp_' + S.me + '_' + TRACK.id, userId: S.me, track: TRACK.id, at: nowISO(), start: {}, axes: {}, bonus: {}, final: null }; DB.trackprog.push(p) }
  p.axes = p.axes || {}; p.start = p.start || {}; p.bonus = p.bonus || {};
  return p;
}
function trCert(uid, n) {
  return DB.extreq.filter(x => x.userId === uid && x.track === TRACK.id && +x.axis === +n).sort((a, b) => (b.at || '').localeCompare(a.at || ''))[0] || null;
}
function trAxisState(uid, n) {
  const p = trProg(uid) || { axes: {} }, a = Object.assign({}, (p.axes || {})[n] || {}, (p.acks || {})[n] ? { ack: p.acks[n] } : {});
  const cert = trCert(uid, n);
  const course = cert ? (cert.status === 'approved' ? 'done' : cert.status === 'rejected' ? 'rejected' : 'pending') : 'todo';
  const pod = a.pod ? 'done' : 'todo', card = a.card && a.card.at ? 'done' : 'todo';
  const done = course === 'done' && pod === 'done' && card === 'done';
  const started = course !== 'todo' || pod === 'done' || card === 'done' || !!(a.reflect || '').trim();
  return { course, pod, card, done, started, cert, a };
}
function trSummary(uid) {
  const st = TRACK.axes.map(x => trAxisState(uid, x.n));
  const done = st.filter(s => s.done).length;
  const hours = st.reduce((s, x) => s + (x.course === 'done' ? (+x.cert.hours || 0) : 0), 0);
  const cards = st.filter(s => s.card === 'done').length, pending = st.filter(s => s.course === 'pending').length;
  const next = TRACK.axes.find((x, i) => !st[i].done);
  const p = trProg(uid);
  return { st, done, hours, cards, pending, next, final: p && p.final, started: st.some(s => s.started) || !!(p && Object.values(p.start || {}).some(v => (v || '').trim())) };
}
function trSave(p, what) { commit('trackprog'); if (what) audit('track.' + what, 'trackprog', p.id, TRACK.title) }
function trNotifyUp(subj, body) {
  const u = ME(), m = u && u.managerId && U(u.managerId);
  if (m) notify(m.id, subj, 'مسار القيادات', body, 'عرض البطاقة', 'linemgr:track');
  tmUsers().forEach(t => { if (!m || t.id !== m.id) notify(t.id, subj, 'مسار القيادات', body, 'متابعة المسار', 'trainmgr:trackadm') });
}

function trRing(done, total) {
  const pct = Math.round(done / total * 100);
  return `<div class="tr-ring" style="background:conic-gradient(var(--sky) ${pct}%,rgba(255,255,255,.16) 0)"><div><b class="num">${done}</b><span>من ${total}</span></div></div>`;
}

}

   <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn sec" data-act="tr-ref" data-n="${a.n}">حفظ</button></div></div>

VIEWS.track = () => {

function trTabs() {
  const n = trTeamCards().filter(x => !x.ack).length;

}

/* ---------- الرئيس: بطاقات فريقه ---------- */
function trTeamCards() {
  const team = DB.users.filter(u => inc(u) && u.managerId === S.me && isLeader(u));
  const out = [];
  team.forEach(u => { const p = trProg(u.id); if (!p) return; Object.entries(p.axes || {}).forEach(([n, a]) => { if (a.card && a.card.at) out.push({ u, n: +n, a, card: a.card, ack: (p.acks || {})[n], p }) }) });
  return out.sort((x, y) => (x.ack ? 1 : 0) - (y.ack ? 1 : 0) || y.card.at.localeCompare(x.card.at));
}
function vTrackTeam() {
  const team = DB.users.filter(u => inc(u) && u.managerId === S.me && isLeader(u));
  const cards = trTeamCards();
  return `${pg('بطاقات التطبيق لفريقك', 'بطاقات التطبيق اللي أرسلها القادة المرتبطون بك في مسار القيادات. اطّلع عليها واكتب ملاحظة إذا حبيت.')}
  ${team.length ? `<div class="card tbl-wrap" style="margin-bottom:16px"><table><thead><tr><th>القائد</th><th>محاور مكتملة</th><th>بطاقات مرسلة</th><th>ساعات معتمدة</th></tr></thead><tbody>${team.map(u => { const s = trSummary(u.id); return `<tr><td><b>${esc(u.name)}</b></td><td class="num">${s.done} / 10</td><td class="num">${s.cards}</td><td class="num">${num(s.hours)}</td></tr>` }).join('')}</tbody></table></div>` : ''}
  ${cards.length ? cards.map(x => trCardView(x, true)).join('') : `<div class="card empty">${ico('inbox')}<div>${team.length ? 'ما وصلت بطاقات للحين.' : 'ما عندك قادة مرتبطين بك في المسار.'}</div></div>`}`;
}
function trCardView(x, canAck) {
  const a = TR_AX(x.n);
  return `<article class="card pad tr-cardv"><div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b>${esc(x.u.name)}</b> · <span class="small muted">المحور ${x.n}: ${esc(a.t)} · ${fmt(x.card.at.slice(0, 10))}</span></div>
   ${x.ack ? `<span class="tr-pill tr-ok">${ico('check')} اطّلعت</span>` : ''}</div>
   <b class="tr-cname">${esc(a.k.t)}</b>
   <dl class="tr-dl">${a.k.f.map((l, i) => `<dt>${esc(l)}</dt><dd>${esc((x.card.f || [])[i] || '—')}</dd>`).join('')}</dl>
   ${x.ack ? (x.ack.note ? `<div class="small muted">ملاحظتك: ${esc(x.ack.note)}</div>` : '')
    : canAck ? `<div class="row" style="gap:8px;margin-top:8px"><input class="inp" id="tra_${x.u.id}_${x.n}" placeholder="ملاحظة قصيرة للقائد (اختياري)" maxlength="300" style="flex:1"><button class="btn sec" data-act="tr-ack" data-u="${x.u.id}" data-n="${x.n}">اطّلعت</button></div>` : ''}</article>`;
}

/* ---------- مدير التدريب: متابعة المسار ---------- */
function vTrackAdm() {
  const L = trLeaders(), sums = L.map(u => ({ u, s: trSummary(u.id) }));
  const started = sums.filter(x => x.s.started).length, finished = sums.filter(x => x.s.done === 10).length;
  const cards = sums.reduce((t, x) => t + x.s.cards, 0), pend = sums.reduce((t, x) => t + x.s.pending, 0);
  const conf = trConf();
  const dot = s => `<span class="tr-dot ${s.done ? 'd' : s.started ? 'p' : ''}" title="${s.done ? 'مكتمل' : s.started ? 'بدأ' : 'لم يبدأ'}"></span>`;
  const others = DB.users.filter(u => inc(u) && u.active !== false && !isLeader(u) && !(u.roles || []).every(r => r === 'sysadmin' || r === 'trainer'));
  return `${pg(TRACK.title, 'متابعة القادة في المسار: من بدأ، ووين وصل، وبطاقات التطبيق اللي أرسلوها.')}
  <div class="grid g4" style="margin-bottom:16px">${kpiTile('users', 'var(--sky-2)', 'var(--teal)', L.length, 'قادة في المسار')}${kpiTile('play', 'var(--sky-2)', 'var(--teal)', started, 'بدؤوا')}${kpiTile('award', 'var(--sky-2)', 'var(--teal)', finished, 'أكملوا المحاور العشرة')}${kpiTile('clock', 'var(--sky-2)', 'var(--teal)', pend, 'شهادات بانتظار اعتمادك')}</div>
  ${pend ? `<div class="note" style="margin-bottom:12px">${ico('clock')} شهادات الدورات تصلك في «الطلبات والمتابعة ← الدورات الخارجية»، ومكتوب فيها رقم المحور. <button class="linkbtn" data-act="go" data-v="requests">افتح الطلبات</button></div>` : ''}
  <div class="card tbl-wrap"><table class="tr-mx"><thead><tr><th>القائد</th>${TRACK.axes.map(a => `<th title="${esc(a.t)}" class="num">${a.n}</th>`).join('')}<th>البطاقات</th><th>الساعات</th><th></th></tr></thead>
  <tbody>${sums.map(({ u, s }) => `<tr><td><b>${esc(u.name)}</b><div class="small muted">${esc(u.title || '')}</div></td>${s.st.map(dot).join('')}<td class="num">${s.cards}</td><td class="num">${num(s.hours)}</td><td>${s.cards ? `<button class="btn ghost sm" data-act="tr-who" data-u="${u.id}">البطاقات</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="14" class="muted">لا يوجد قادة. القادة هم من لهم صفة «رئيس مباشر»، وتقدر تضيف غيرهم من تحت.</td></tr>`}</tbody></table></div>
  <div class="small muted" style="margin:6px 2px 16px"><span class="tr-dot d"></span> مكتمل (دورة معتمدة + حلقة + بطاقة) · <span class="tr-dot p"></span> بدأ · <span class="tr-dot"></span> لم يبدأ</div>
  <div class="card pad"><h3>المشاركون</h3><div class="h-sub">كل من له صفة «رئيس مباشر» داخل المسار تلقائيًا. أضف هنا من يُعتبر من القيادات بدون هذه الصفة، مثل عميدة المعهد أو وكيلاتها.</div>
   <div class="row wrap" style="gap:8px;margin:10px 0"><select class="inp" id="tr_add" style="max-width:320px">${options(others.map(u => [u.id, u.name]), '', 'اختر موظفًا…')}</select><button class="btn sec" data-act="tr-add">أضف للمسار</button></div>
   ${(conf.extra || []).length ? `<div class="row wrap" style="gap:6px">${conf.extra.map(id => `<span class="tag">${esc((U(id) || {}).name || id)} <button class="linkbtn" data-act="tr-rm" data-u="${id}" aria-label="إزالة">✕</button></span>`).join('')}</div>` : ''}</div>`;
}
VIEWS.trackadm = vTrackAdm;

/* ---------- الإجراءات ---------- */
Object.assign(ACT, {
  'tr-tab'(t) { S.trTab = t.dataset.t; draw() },
  'tr-axis'(t) { S.trackAxis = t.dataset.n || null; S._trPlay = null; if (S.view !== 'track') go('track'); else draw(); scrollTo(0, 0) },
  'tr-play'(t) { S._trPlay = t.dataset.k; draw() },
  'tr-start'() { const p = trMine(); TRACK.start.f.forEach((_, i) => p.start[i] = fieldVal('trs_' + i)); if (!Object.values(p.start).some(v => v)) { toast('اكتب سطر واحد على الأقل'); return } trSave(p, 'start'); toast('حُفظت وقفتك. بالتوفيق في المسار'); draw() },
  'tr-ref'(t) { const p = trMine(), n = t.dataset.n; p.axes[n] = p.axes[n] || {}; p.axes[n].reflect = fieldVal('tr_ref'); trSave(p); toast('حُفظت') },
  'tr-pod'(t) {
    const p = trMine(), n = t.dataset.n;
    if (n === 'ai') { p.bonus.pod = nowISO() } else { p.axes[n] = p.axes[n] || {}; p.axes[n].pod = nowISO() }
    trSave(p, 'podcast'); toast('سُجّل استماعك للحلقة'); draw();
  },
  'tr-bonus'() { const p = trMine(); p.bonus.f = TRACK.bonus.f.map((_, i) => fieldVal('trb_' + i)); p.bonus.at = nowISO(); trSave(p, 'bonus'); toast('حُفظت بطاقة التجربة') },
  'tr-card'(t) {
    const a = TR_AX(t.dataset.n), f = a.k.f.map((_, i) => fieldVal('trk_' + i));
    if (f.filter(Boolean).length < 2) { toast('عبّ البطاقة', 'اكتب إجابة موجزة في خانتين على الأقل'); return }
    const p = trMine(), x = p.axes[a.n] = p.axes[a.n] || {}, first = !(x.card && x.card.at);
    x.card = { f, at: nowISO() }; if (!first && p.acks) delete p.acks[a.n];
    trSave(p, 'card');
    trNotifyUp(`${(ME() || {}).name} أرسل بطاقة تطبيق: ${a.k.t}`, `<p>المحور ${a.n}: <b>${esc(a.t)}</b>.</p>${a.k.f.map((l, i) => `<p><b>${esc(l)}:</b> ${esc(f[i] || '—')}</p>`).join('')}`);
    toast(first ? 'أُرسلت البطاقة لرئيسك وإدارة التدريب' : 'حُدّثت البطاقة'); draw();
  },
  'tr-cert'(t) {
    const a = TR_AX(t.dataset.n), c = a.c;
    S._trc = a.n;
    mask(`${mHead('شهادة إتمام الدورة', `المحور ${a.n}: ${esc(a.t)}`)}<div class="m-b">
     <div class="note" style="margin-bottom:12px"><b>${esc(c.name)}</b> — ${esc(c.pf)}. تروح الشهادة لإدارة التدريب، وتنحسب ساعاتها في سجلك بعد الاعتماد.</div>
     <div class="fgrid"><div class="field"><label for="trc_date">تاريخ الإتمام *</label><input class="inp" id="trc_date" type="date" max="${TODAY()}" value="${TODAY()}"></div>
      <div class="field"><label for="trc_h">عدد الساعات${c.h ? '' : ' * (كما في الشهادة)'}</label><input class="inp" id="trc_h" type="number" min="0.5" max="60" step="0.5" ${c.h ? `value="${c.h}" readonly style="background:var(--sky-3)"` : ''}></div>
      <div class="field full"><label for="trc_f">ملف الشهادة * (PDF/JPG/PNG حتى ${(FILE_MAX / 1e6).toFixed(1)} م.ب)</label><input class="inp" id="trc_f" type="file" accept=".pdf,.jpg,.jpeg,.png"></div></div>
     ${c.h ? `<p class="small muted" style="margin-top:8px">مدة الدورة ${esc(c.dur)}، وتنحسب ${num(c.h)} ساعة (مقرّبة لأقرب نصف ساعة للأسفل).</p>` : ''}</div>
    <div class="m-f"><button class="btn sec" data-act="close">إلغاء</button><button class="btn" data-act="tr-cert-go">أرسل للاعتماد</button></div>`);
  },
  'tr-cert-go': safe(async () => {
    const a = TR_AX(S._trc), c = a.c, cf = document.getElementById('trc_f').files[0];
    const hours = c.h || +fieldVal('trc_h');
    if (!fieldVal('trc_date')) { toast('اختر تاريخ الإتمام'); return }
    if (!hours || hours <= 0) { toast('اكتب عدد الساعات كما في الشهادة'); return }
    if (!cf) { toast('ارفع ملف الشهادة'); return }
    const bad = fileCheck(cf); if (bad) { toast('ملف الشهادة غير مقبول', bad); return }
    const sf = await storeFile(cf); if (!sf.ok) { toast('ملف الشهادة غير مقبول', sf.msg); return }
    const r = submitExt(S.me, { title: c.name, provider: c.pf, trainer: '', date: fieldVal('trc_date'), hours, field: TRACK.cat, desc: `${TRACK.title} — المحور ${a.n}: ${a.t}`, skills: '', certFile: sf.id, attach: [] });
    if (!r.ok) { DB.files = DB.files.filter(x => x.id !== sf.id); commit('files'); toast('تعذّر الإرسال', r.msg); return }
    r.req.track = TRACK.id; r.req.axis = a.n; commit('extreq');
    closeLayer(); toast('أُرسلت الشهادة لإدارة التدريب'); draw();
  }),
  'tr-final'() {

    nodes.forEach((n, i) => { n.style.setProperty('--d', i * 45 + 'ms'); n.classList.add('in-up') });

    view.querySelectorAll('.pbar > i').forEach(el => {
      const w = el.style.width; if (!w || w === '0%') return;
      el.style.transition = 'none'; el.style.width = '0%';
      el.getBoundingClientRect();
      el.style.transition = 'width .9s cubic-bezier(.22,.8,.3,1) .15s';
      el.style.width = w;
    });

    view.querySelectorAll('.ring').forEach(el => {
      const p = getComputedStyle(el).getPropertyValue('--p').trim();
      if (!p || p === '0') return;
      const had = el.style.getPropertyValue('--p');
      el.style.setProperty('--p', '0'); el.getBoundingClientRect();
      requestAnimationFrame(() => { had ? el.style.setProperty('--p', had) : el.style.removeProperty('--p') });
    });

    view.querySelectorAll('.kpi .v, .ring b').forEach(countUp);
  }

  // عدّ تصاعدي لأول رقم داخل العنصر، مع الحفاظ على بقية النص وعلى العناصر الداخلية
  function countUp(el) {
    const node = [...el.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.nodeValue));
    if (!node) return;
    const txt = node.nodeValue, m = txt.match(/\d[\d,]*(\.\d+)?/);
    if (!m) return;
    const target = parseFloat(m[0].replace(/,/g, ''));
    if (!isFinite(target) || target <= 0 || target >= 1e9) return;
    const dec = (m[0].split('.')[1] || '').length, grp = m[0].includes(',');
    const pre = txt.slice(0, m.index), post = txt.slice(m.index + m[0].length);
    const fmtN = v => (grp ? v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec })
                           : v.toFixed(dec));
    const t0 = performance.now(), dur = 700;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      node.nodeValue = pre + fmtN(target * e) + post;
      if (k < 1) requestAnimationFrame(step);
    };
    node.nodeValue = pre + fmtN(0) + post;
    requestAnimationFrame(step);
  }

  // الرسم يستبدل الصفحة كاملة، والنوافذ المنبثقة ترسم نفسها، فنراقب التغيّر بدل ربطه بدالة واحدة
  let busy = false, queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false; busy = true;
      try { place(); fadeView() } finally { requestAnimationFrame(() => { busy = false }) }
    });
  }
  new MutationObserver(() => { if (!busy) schedule() })
    .observe(document.body, { childList: true, subtree: true });
  // طيّ القائمة الجانبية: الصنف على <html> فيبقى بعد إعادة رسم الصفحة
  const SIDE_KEY = 'qb.sideOff';
  try { if (localStorage.getItem(SIDE_KEY) === '1') document.documentElement.classList.add('side-off') } catch (e) { }
  ACT.sidetoggle = function () {
    const off = document.documentElement.classList.toggle('side-off');
    try { localStorage.setItem(SIDE_KEY, off ? '1' : '0') } catch (e) { }
    setTimeout(() => { prev.clear(); schedule() }, 320);
  };

  addEventListener('resize', () => { prev.clear(); schedule() });
  schedule();
})();

// الرمز يفتح صفحة تحقّق عامة؛ الرابط يُطلب من الخادم لأنه يحمل توقيعًا لا يمكن توقّعه.
async function certQr(id) {
  const box = document.getElementById('certqr'), cap = document.getElementById('certqrcap');
  if (!box) return;
  try {
    const r = await fetch('/api/cert/link?id=' + encodeURIComponent(id));
    const d = await r.json();
    if (!d || !d.url) return;
    await loadScript(CDN.qr);
    if (!document.getElementById('certqr')) return;
    box.innerHTML = '';
    new QRCode(box, { text: d.url, width: 54, height: 54, colorDark: '#072C49', colorLight: '#FBFAF7', correctLevel: QRCode.CorrectLevel.M });
    box.title = d.url;
    if (cap) cap.style.display = '';
  } catch (e) { /* الشهادة تبقى صالحة بدون الرمز */ }
}

function impParse(rows) {
  const dom = (DB.settings.emailDomain || '').toLowerCase();
  const deptBy = new Map(DB.depts.map(d => [d.name.trim(), d.id]));
  const jobBy = new Map(DB.jobs.map(j => [j.title.trim(), j.id]));
  const userBy = new Map(DB.users.map(u => [u.name.trim(), u.id]));
  const mailBy = new Map(DB.users.map(u => [u.email.toLowerCase(), u]));
  const seen = new Set(), out = { add: [], upd: [], bad: [] };
  rows.forEach((r, i) => {
    const line = i + 2, g = k => String(r[k] ?? '').trim();
    const name = g('الاسم الكامل'), email = g('البريد الرسمي').toLowerCase();
    if (!name && !email) return;
    const bad = m => out.bad.push({ line, name: name || email, msg: m });
    if (name.length < 3) return bad('الاسم ناقص أو أقل من ثلاثة أحرف');
    if (!emailOk(email)) return bad('البريد غير صالح');
    if (dom && !email.endsWith('@' + dom)) return bad('البريد خارج نطاق @' + dom);
    if (seen.has(email)) return bad('البريد مكرر داخل الملف نفسه');
    seen.add(email);
    const dName = g('القسم'), jName = g('الوصف الوظيفي'), mName = g('الرئيس المباشر');
    if (dName && !deptBy.has(dName)) return bad(`القسم «${dName}» غير موجود في الهيكل التنظيمي`);
    if (jName && !jobBy.has(jName)) return bad(`الوصف الوظيفي «${jName}» غير معرّف`);
    if (mName && !userBy.has(mName)) return bad(`الرئيس «${mName}» غير موجود في المنصة`);
    const rawRoles = g('الصفات').split(/[،,]/).map(x => x.trim()).filter(Boolean);
    const roles = rawRoles.map(roleKey);
    if (roles.some(x => !x)) return bad('صفة غير معروفة: ' + rawRoles[roles.findIndex(x => !x)]);
    const rec = {
      name, email, title: g('المسمى'), empNo: g('الرقم الوظيفي'),
      deptId: dName ? deptBy.get(dName) : null, jobId: jName ? jobBy.get(jName) : null,
      managerId: mName ? userBy.get(mName) : null, roles: roles.length ? roles : ['employee'], line
    };
    if (roles.includes('trainer')) return bad('صفة «مدرب» تحتاج ربط ملف مدرب — أضفه من المنصة');
    (mailBy.has(email) ? out.upd : out.add).push(rec);
  });
  return out;
}

async function impPasswords(users) {
  const rows = [['الاسم', 'البريد', 'كلمة المرور المؤقتة']], failed = [];
  for (const u of users) {
    try { const r = await api('/api/password/reset', { method: 'POST', body: JSON.stringify({ userId: u.id }) }); rows.push([r.name, r.email, r.password]) }
    catch (e) { failed.push(u.name) }
  }
  if (rows.length > 1) {
    await exportTable('كلمات-المرور-المؤقتة-' + TODAY(), [{ name: 'كلمات المرور', rows }], 'xlsx');
    toast('نُزّل ملف كلمات المرور', 'سلّم كل موظف كلمته بنفسك');
  }
  if (failed.length) toast('تعذّر إصدار كلمة المرور لـ ' + num(failed.length), failed.slice(0, 3).join('، '));

  reply: 'رد', add: 'إضافة', quiz: 'اختبار قصير', sync: 'مزامنة', promote: 'ترقية'
};
function audAr(a) {
  if (AUD_ONE[a]) return AUD_ONE[a];
  const p = a.split('.');
  if (p.length >= 2 && AUD_SUBJ[p[0]] && AUD_VERB[p[1]]) return AUD_VERB[p[1]] + ' ' + AUD_SUBJ[p[0]];
  return a;
}
const AUD_CATS = [
  ['accounts', 'الحسابات والدخول', a => /^(user|password|login|logout|demo\.guest|role\.switch)/.test(a)],
  ['content', 'المحتوى التدريبي', a => /^(course|lib|reading|program|comp|job|dept|kpi)/.test(a)],
  ['enroll', 'التسجيلات والطلبات', a => /^(enroll|ext|retake|nudge|attend|plan)/.test(a)],
  ['assess', 'التقييم والاختبارات', a => /^(assess|exam|pretest|lesson|seek)/.test(a)],
  ['system', 'النظام والبيانات', a => /^(settings|backup|restore|reset|integrity|export|load\.demo|purge|denied|conflict)/.test(a)]
];
function audFiltered() {
  const f = S.af2, q = S.af.q.trim();
  const since = f.days ? Date.now() - (+f.days) * 86400e3 : 0;
  const cat = AUD_CATS.find(c => c[0] === f.cat);
  return DB.audit.slice().reverse().filter(a =>
    (f.logins || !/^(login|logout)/.test(a.action)) &&
    (!cat || cat[2](a.action)) &&
    (!f.user || a.by === f.user) &&
    (!since || new Date(a.at).getTime() >= since) &&
    (!q || (audAr(a.action) + a.action + a.byName + a.detail + a.type).includes(q)));
}
VIEWS['adm-audit'] = function () {
  const L = audFiltered(), f = S.af2;
  const who = [...new Map(DB.audit.map(a => [a.by, a.byName])).entries()].filter(([k, v]) => k && v);
  return `${pg('سجل التدقيق', `يسجّل العمليات المؤثرة: من فعل ماذا ومتى. السجل محدود بآخر ${N(3000)} عملية.`,
    `<button class="btn ghost sm" data-act="exp-audit" data-fmt="xlsx">Excel</button><button class="btn ghost sm" data-act="exp-audit" data-fmt="csv">CSV</button>`)}
  <div class="adm-bar">
    <div class="adm-search"><input class="inp" id="aq" value="${esc(S.af.q)}" placeholder="بحث في الإجراء أو المستخدم أو التفاصيل" aria-label="بحث"></div>
    <select class="inp" data-act="af2-set" data-k="cat" aria-label="نوع العملية">${options(AUD_CATS.map(c => [c[0], c[1]]), f.cat, 'كل أنواع العمليات')}</select>
    <select class="inp" data-act="af2-set" data-k="user" aria-label="المستخدم">${options(who, f.user, 'كل المستخدمين')}</select>
    <select class="inp" data-act="af2-set" data-k="days" aria-label="المدة">${options([['7', 'آخر ٧ أيام'], ['30', 'آخر ٣٠ يومًا'], ['90', 'آخر ٣ أشهر']], f.days, 'كل المدة')}</select>
    <label class="chk" style="white-space:nowrap"><input type="checkbox" data-act="af2-logins" ${f.logins ? 'checked' : ''}> إظهار عمليات الدخول</label>
  </div>
  <div class="small muted" style="margin:10px 0 2px">${f.logins ? '' : 'عمليات الدخول والخروج مخفية · '}يُعرض ${num(Math.min(300, L.length))} من ${num(L.length)}</div>
  <div class="card tbl-wrap"><table class="sm-t"><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>على</th><th>التفاصيل</th></tr></thead><tbody>${L.slice(0, 300).map(a => `<tr>
    <td class="small num" style="white-space:nowrap">${esc(a.at.replace('T', ' ').slice(0, 16))}</td>
    <td class="small">${esc(a.byName)}<div class="muted" style="font-size:11px">${esc(ROLES[a.role] || '')}</div></td>
    <td class="small"><span class="tag ${/denied|fail/.test(a.action) ? 'bad' : ''} mini">${esc(audAr(a.action))}</span></td>
    <td class="small muted">${esc(AUD_SUBJ[a.type] || a.type || '—')}</td>
    <td class="small">${esc(a.detail)}</td></tr>`).join('') || `<tr><td colspan="5" class="muted" style="text-align:center;padding:26px">لا عمليات مطابقة${!S.af2.logins && DB.audit.some(a => /^(login|logout)/.test(a.action)) ? ' — عمليات الدخول مخفية، فعّل الخيار أعلاه لعرضها' : ''}</td></tr>`}</tbody></table></div>`;
};
Object.assign(ACT, {
  'af2-set'(t) { S.af2[t.dataset.k] = t.value; draw() },
  'af2-logins'(t) { S.af2.logins = t.checked; draw() }
});

/* ---------- ٤) البيانات: أسماء عربية وحماية التفريغ ---------- */
const COL_AR = {
  users: 'المستخدمون', depts: 'الإدارات والأقسام', jobs: 'الأوصاف الوظيفية', comps: 'الكفايات', assess: 'تقييم المهارات',
  courses: 'الدورات', libs: 'المكتبة', enrolls: 'التسجيلات', completions: 'الشهادات', surveys: 'استبانات الرضا',
  attempts: 'محاولات الاختبار', progress: 'تقدّم المشاهدة', tests: 'الاختبارات', mgrEvals: 'تقييم الرؤساء',
  kpis: 'المؤشرات', kpiMeas: 'قياسات المؤشرات', kpiLinks: 'روابط المؤشرات', programs: 'البرامج', plans: 'الخطط',
  trainers: 'المدربون', mails: 'الرسائل', audit: 'سجل التدقيق', nominations: 'الترشيحات', libenr: 'تسجيلات المكتبة',
  readings: 'مواد القراءة', readprog: 'تقدّم القراءة', comments: 'التعليقات', extreq: 'الطلبات الخارجية',
  visits: 'الزيارات الميدانية', retakes: 'طلبات الإعادة', files: 'الملفات', tracks: 'المسارات',
  trackprog: 'تقدّم المسارات', settings: 'الإعدادات'
};
{
  const orig = VIEWS['adm-data'];
  VIEWS['adm-data'] = () => orig().replace(/<span class="small muted">([A-Za-z]+)<\/span>/g,
    (m, c) => COL_AR[c] ? `<span class="small muted">${COL_AR[c]}</span>` : m);
}
ACT['reset-all'] = function () {
  if (!guard('backup')) return;
  const tot = COLS.reduce((n, c) => n + DB[c].length, 0);
  const big = [['users', 'حسابًا'], ['courses', 'دورة'], ['completions', 'شهادة'], ['enrolls', 'تسجيلًا']]
    .filter(([c]) => DB[c].length).map(([c, w]) => `${num(DB[c].length)} ${w}`).join('، ');
  const last = lsGet('qb.lastBackup');
  const ago = last ? Math.round((Date.now() - +last) / 86400e3) : null;
  mask(`${mHead('تفريغ كل البيانات')}<div class="m-b">
   <div class="note warn" style="margin-bottom:12px">سيُحذف <b class="num">${num(tot)} سجلًا</b>: ${esc(big)}، وكل ما بُني عليها. لا يمكن التراجع عن هذه العملية إلا باستعادة نسخة احتياطية.</div>
   <div class="small muted" style="margin-bottom:12px">آخر نسخة احتياطية: <b>${last ? (ago === 0 ? 'اليوم' : ago === 1 ? 'أمس' : 'قبل ' + num(ago) + ' يومًا') : 'لا توجد نسخة من هذا المتصفح'}</b></div>
   <div class="field"><label for="rs_word">للتأكيد اكتب كلمة <b>تفريغ</b> في الحقل</label>
     <input class="inp" id="rs_word" autocomplete="off" placeholder="اكتب الكلمة هنا"></div></div>
   <div class="m-f"><button class="btn sec" data-act="close">إلغاء</button>
    <button class="btn" id="rs_go" data-act="reset-ok" disabled style="background:var(--bad,#C0392B);opacity:.45;pointer-events:none">تفريغ كل البيانات</button>
    <button class="btn sec" data-act="backup" style="margin-inline-start:auto">تنزيل نسخة احتياطية أولًا</button></div>`);
};
{
  const origBackup = ACT.backup;
  ACT.backup = function (t, e) { try { lsSet('qb.lastBackup', String(Date.now())) } catch (x) { } return origBackup.call(this, t, e) };
}

/* ---------- ربط حقول البحث والتأكيد ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'uq') { S.uf.q = t.value; S.umenu = null; draw() }
  else if (t.id === 'rs_word') {
    const b = document.getElementById('rs_go'), ok = t.value.trim() === 'تفريغ';
    if (b) { b.disabled = !ok; b.style.opacity = ok ? '1' : '.45'; b.style.pointerEvents = ok ? '' : 'none' }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'imp_file' && e.target.files[0]) {
    const f = e.target.files[0];
    (async () => {
      try {
        await loadScript(CDN.xlsx);
        const buf = await f.arrayBuffer();
        const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
        const ws = wb.Sheets['الموظفون'] || wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
        S.imp = { fileName: f.name, parsed: impParse(rows) };
        impModal();
      } catch (err) { toast('تعذّر قراءة الملف', err.message) }
    })();
  }
});


(async function boot(){
  S.booting=true;draw();
  if(location.hash==='#trainers')S.portal='trainer';
  try{const m=await api('/api/me');S.role=m.role;S.mustChange=!!m.mustChange;await loadAll();S.booting=false;doLogin(m.user.id);if(S.mustChange)askPwChange(true)}
  catch(e){S.booting=false;draw()}
  setInterval(poll,3000);
  window.addEventListener('beforeunload',()=>{if(ALLC().some(c=>diffCol(c).length))flush()});
})();

</script>
