name = "qb-training"
main = "src/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# النطاقات المخصّصة: كل جهة تأخذ نطاقًا فرعيًا باسمها
routes = [
  { pattern = "dallearn.com", custom_domain = true },
  { pattern = "www.dallearn.com", custom_domain = true },
  { pattern = "qb.dallearn.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# صفحة التحقق من الشهادة ليست جزءًا من التطبيق أحادي الصفحة، فتصل إلى الخادم مباشرة
run_worker_first = ["/api/*", "/v/*"]

[[d1_databases]]
binding = "DB"
database_name = "qb-training-db"
database_id = "ba3d1083-39e3-4c56-bcb6-ab889ef5ebc5"
migrations_dir = "migrations"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true
